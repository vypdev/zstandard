name: Set up Linux CI dependencies
description: Install the native tools required by the Linux self-hosted CI runners.

inputs:
  android:
    description: Install the runtime libraries required by the Android emulator.
    required: false
    default: 'false'
  desktop:
    description: Install GTK and Xvfb for desktop integration tests.
    required: false
    default: 'false'
  coverage:
    description: Install lcov and bc for coverage gates.
    required: false
    default: 'false'

runs:
  using: composite
  steps:
    - name: Install Linux packages
      shell: bash
      env:
        DESKTOP: ${{ inputs.desktop }}
        COVERAGE: ${{ inputs.coverage }}
        ANDROID: ${{ inputs.android }}
      run: |
        set -euo pipefail

        if ! command -v apt-get >/dev/null 2>&1; then
          echo "This action requires a Debian/Ubuntu-based Linux runner."
          exit 1
        fi

        if [[ "$(id -u)" -eq 0 ]]; then
          SUDO=()
        elif command -v sudo >/dev/null 2>&1 && sudo -n true 2>/dev/null; then
          SUDO=(sudo)
        else
          echo "The self-hosted runner needs passwordless sudo to install CI dependencies."
          exit 1
        fi

        packages=(build-essential clang cmake coreutils ninja-build pkg-config curl unzip)
        if [[ "$ANDROID" == 'true' ]]; then
          packages+=(
            iproute2
            libdbus-1-3
            libfontconfig1
            libgl1
            libnss3
            libpulse0
            libx11-6
            libx11-xcb1
            libxcb1
            libxcomposite1
            libxcursor1
            libxdamage1
            libxi6
            libxrandr2
            libxrender1
            libxtst6
            procps
          )
        fi
        if [[ "$DESKTOP" == 'true' ]]; then
          packages+=(libgtk-3-dev xvfb)
        fi
        if [[ "$COVERAGE" == 'true' ]]; then
          packages+=(bc lcov)
        fi

        "${SUDO[@]}" apt-get update
        DEBIAN_FRONTEND=noninteractive "${SUDO[@]}" apt-get install -y --no-install-recommends "${packages[@]}"

        cmake --version
        clang --version
        ninja --version
        pkg-config --version
        timeout --version | head -n 1
