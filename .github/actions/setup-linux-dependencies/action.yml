name: Set up Linux CI dependencies
description: Prepare native tools in a private job prefix without changing host packages.

inputs:
  android:
    description: Install the runtime libraries required by the Android emulator.
    required: false
    default: 'false'
  desktop:
    description: Install GTK and Xvfb for desktop integration tests.
    required: false
    default: 'false'
  browser:
    description: Install the runtime libraries required by Chrome for Testing.
    required: false
    default: 'false'
  coverage:
    description: Install lcov and bc for coverage gates.
    required: false
    default: 'false'
  arm64:
    description: Install the AArch64 cross compiler used by release artifacts.
    required: false
    default: 'false'

runs:
  using: composite
  steps:
    - name: Prepare private Linux packages
      shell: bash
      env:
        DESKTOP: ${{ inputs.desktop }}
        COVERAGE: ${{ inputs.coverage }}
        ANDROID: ${{ inputs.android }}
        ARM64: ${{ inputs.arm64 }}
        BROWSER: ${{ inputs.browser }}
      run: |
        bash "$GITHUB_ACTION_PATH/../copilot-verification-setup/linux-dependencies.sh"
