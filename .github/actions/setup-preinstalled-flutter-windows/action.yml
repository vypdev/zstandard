name: Set up Flutter on Windows
description: Install, cache, and validate the pinned Flutter SDK on Windows.

inputs:
  flutter-version:
    description: Required Flutter stable version.
    required: true

runs:
  using: composite
  steps:
    - name: Install pinned Flutter SDK
      uses: subosito/flutter-action@v2
      with:
        channel: stable
        flutter-version: ${{ inputs.flutter-version }}
        cache: true
        pub-cache: false

    - name: Verify Flutter and Windows toolchain
      # Some self-hosted machines enforce a restrictive PowerShell execution
      # policy. Use cmd so CI does not need to change the machine-wide policy
      # or execute a PowerShell script.
      shell: cmd
      env:
        REQUIRED_FLUTTER_VERSION: ${{ inputs.flutter-version }}
      run: |
        @echo off
        if not defined FLUTTER_ROOT (
          echo Flutter action did not expose FLUTTER_ROOT.
          exit /b 1
        )
        git config --global --add safe.directory "%FLUTTER_ROOT%"
        set "FLUTTER_COMMAND="
        where flutter >nul 2>&1 || (echo Flutter is not available on PATH. & exit /b 1)
        for /f "delims=" %%F in ('where flutter') do if not defined FLUTTER_COMMAND set "FLUTTER_COMMAND=%%F"
        for /f "tokens=2" %%V in ('call flutter --version ^| findstr /b "Flutter "') do set "ACTUAL_VERSION=%%V"
        if not defined ACTUAL_VERSION (echo Unable to determine the installed Flutter version. & exit /b 1)
        if not "%ACTUAL_VERSION%" == "%REQUIRED_FLUTTER_VERSION%" (
          echo Expected Flutter %REQUIRED_FLUTTER_VERSION%, got %ACTUAL_VERSION% at %FLUTTER_COMMAND%.
          exit /b 1
        )
        call flutter config --enable-windows-desktop
        where cmake >nul 2>&1 || (echo CMake is not available on PATH. & exit /b 1)
        where ctest >nul 2>&1 || (echo CTest is not available on PATH. & exit /b 1)
        call flutter --version
        cmake --version
        for %%F in ("%FLUTTER_COMMAND%") do set "FLUTTER_BIN=%%~dpF"
        for %%F in ("%FLUTTER_BIN%..") do set "FLUTTER_ROOT=%%~fF"
        >> "%GITHUB_ENV%" echo FLUTTER_ROOT=%FLUTTER_ROOT%
        >> "%GITHUB_PATH%" echo %FLUTTER_ROOT%\bin
        >> "%GITHUB_PATH%" echo %FLUTTER_ROOT%\bin\cache\dart-sdk\bin
