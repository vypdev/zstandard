name: Set up Flutter for CI
description: Install the pinned Flutter SDK and trust its shared checkout on self-hosted runners.

inputs:
  flutter-version:
    description: Flutter stable version to install.
    required: true

runs:
  using: composite
  steps:
    - name: Install Flutter
      uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
      with:
        channel: stable
        flutter-version: ${{ inputs.flutter-version }}
        cache: true
        pub-cache: false

    - name: Trust the Flutter SDK checkout
      shell: bash
      run: git config --global --add safe.directory "$FLUTTER_ROOT"
