name: PR Check macOS

on:
  pull_request:
    branches:
      - '**'
      - '!master'
  push:
    branches:
      - develop

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Swift Package Manager support requires Flutter 3.44 or newer.
  FLUTTER_VERSION: '3.47.2'

jobs:
  check_macos_analyze:
    name: Analyze macOS
    runs-on: [self-hosted, macOS, ARM64]
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6

      - uses: ./.github/actions/preserve-flutter-project-files
        with:
          package: zstandard_macos
          mode: save

      - uses: ./.github/actions/setup-preinstalled-flutter
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}

      - name: Get dependencies
        working-directory: zstandard_macos
        run: flutter pub get

      - uses: ./.github/actions/preserve-flutter-project-files
        with:
          package: zstandard_macos
          mode: restore

      - name: Analyze check
        working-directory: zstandard_macos
        run: flutter analyze

      - name: Run package tests
        working-directory: zstandard_macos
        run: flutter test

  check_macos_test:
    name: Test macOS (${{ matrix.dependency_manager }}, ${{ matrix.source }})
    runs-on: [self-hosted, macOS, ARM64]
    timeout-minutes: 60
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        dependency_manager: [swiftpm, cocoapods]
        source: [workspace, pub-cache]
    steps:
      - uses: actions/checkout@v6

      - uses: ./.github/actions/preserve-flutter-project-files
        with:
          package: zstandard_macos
          mode: save

      - uses: ./.github/actions/setup-preinstalled-flutter
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}

      - name: Select native dependency manager
        run: |
          if [[ "${{ matrix.dependency_manager }}" == "swiftpm" ]]; then
            flutter config --enable-swift-package-manager
          else
            flutter config --no-enable-swift-package-manager
          fi

      - name: Use checkout for SwiftPM native dependency
        if: matrix.dependency_manager == 'swiftpm' && matrix.source == 'workspace'
        run: echo "ZSTANDARD_NATIVE_PACKAGE_PATH=$GITHUB_WORKSPACE" >> "$GITHUB_ENV"

      - name: Hide workspace native package to force Pub cache resolution
        if: matrix.source == 'pub-cache'
        run: |
          mv zstandard_native "$RUNNER_TEMP/zstandard_native"

      - name: Clean plugin and example
        run: |
          (cd zstandard_macos && flutter clean)
          (cd zstandard_macos/example && flutter clean)

      - name: Get plugin dependencies
        working-directory: zstandard_macos
        run: flutter pub get

      - name: Get example dependencies
        working-directory: zstandard_macos/example
        run: flutter pub get

      - uses: ./.github/actions/preserve-flutter-project-files
        with:
          package: zstandard_macos
          mode: restore

      - name: Install CocoaPods dependencies
        if: matrix.dependency_manager == 'cocoapods'
        working-directory: zstandard_macos/example/macos
        run: pod install --verbose

      - name: Build macOS example
        working-directory: zstandard_macos/example
        run: flutter build macos --debug

      - name: Launch macOS example and run integration tests
        working-directory: zstandard_macos/example
        run: bash ../../scripts/run_with_timeout.sh 900 flutter test integration_test/ -d macos

      - name: Restore workspace native package
        if: always() && matrix.source == 'pub-cache'
        run: |
          if [[ -d "$RUNNER_TEMP/zstandard_native" ]]; then
            mv "$RUNNER_TEMP/zstandard_native" zstandard_native
          fi

  check_macos_publish_dry_run:
    name: Dry Run Publish macOS
    runs-on: [self-hosted, macOS, ARM64]
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6

      - uses: ./.github/actions/preserve-flutter-project-files
        with:
          package: zstandard_macos
          mode: save

      - uses: ./.github/actions/setup-preinstalled-flutter
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}

      - name: Get dependencies
        working-directory: zstandard_macos
        run: flutter pub get

      - uses: ./.github/actions/preserve-flutter-project-files
        with:
          package: zstandard_macos
          mode: restore

      - name: Publish Dry Run
        working-directory: zstandard_macos
        run: dart pub publish --dry-run
