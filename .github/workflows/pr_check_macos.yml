name: PR Check macOS

on:
  push:
    branches:
      - develop
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Swift Package Manager support requires Flutter 3.44 or newer.
  FLUTTER_VERSION: '3.47.2'

jobs:
  check_macos_analyze:
    name: Analyze macOS
    runs-on: [self-hosted, macOS, ARM64]
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803

      - uses: ./.github/actions/preserve-flutter-project-files
        with:
          package: zstandard_macos
          mode: save

      - uses: ./.github/actions/setup-preinstalled-flutter
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}

      - name: Resolve workspace dependencies
        run: bash scripts/create_local_overrides.sh zstandard_macos

      - name: Get dependencies
        working-directory: zstandard_macos
        run: flutter pub get

      - uses: ./.github/actions/preserve-flutter-project-files
        with:
          package: zstandard_macos
          mode: restore

      - name: Analyze check
        working-directory: zstandard_macos
        run: flutter analyze

      - name: Run package tests
        working-directory: zstandard_macos
        run: flutter test

  check_macos_test:
    name: Test macOS (${{ matrix.dependency_manager }}, ${{ matrix.source }})
    runs-on: [self-hosted, macOS, ARM64]
    timeout-minutes: 60
    concurrency:
      group: zstandard-apple-flutter-toolchain
      cancel-in-progress: false
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        dependency_manager: [swiftpm, cocoapods]
        source: [workspace, package-config]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803

      - uses: ./.github/actions/preserve-flutter-project-files
        with:
          package: zstandard_macos
          mode: save

      - uses: ./.github/actions/setup-preinstalled-flutter
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}

      - name: Select native dependency manager
        run: |
          if [[ "${{ matrix.dependency_manager }}" == "swiftpm" ]]; then
            flutter config --enable-swift-package-manager
          else
            flutter config --no-enable-swift-package-manager
          fi

      - name: Use checkout for SwiftPM native dependency
        if: matrix.dependency_manager == 'swiftpm' && matrix.source == 'workspace'
        run: echo "ZSTANDARD_NATIVE_PACKAGE_PATH=$GITHUB_WORKSPACE" >> "$GITHUB_ENV"

      - name: Stage native SwiftPM and Dart packages outside the repository
        if: matrix.source == 'package-config'
        run: |
          mkdir -p "$RUNNER_TEMP/zstandard-stage"
          mv zstandard_native "$RUNNER_TEMP/zstandard-stage/zstandard_native"
          cp Package.swift "$RUNNER_TEMP/zstandard-stage/Package.swift"
          if [[ "${{ matrix.dependency_manager }}" == swiftpm ]]; then
            echo "ZSTANDARD_NATIVE_PACKAGE_PATH=$RUNNER_TEMP/zstandard-stage" >> "$GITHUB_ENV"
          fi

      - name: Resolve the selected native source exactly
        run: |
          if [[ "${{ matrix.source }}" == package-config ]]; then
            bash scripts/create_local_overrides.sh zstandard_macos \
              "$RUNNER_TEMP/zstandard-stage/zstandard_native"
          else
            bash scripts/create_local_overrides.sh zstandard_macos
          fi

      - name: Clean plugin and example
        run: |
          (cd zstandard_macos && flutter clean)
          (cd zstandard_macos/example && flutter clean)

      - name: Get plugin dependencies
        working-directory: zstandard_macos
        run: flutter pub get

      - name: Get example dependencies
        working-directory: zstandard_macos/example
        run: flutter pub get

      - uses: ./.github/actions/preserve-flutter-project-files
        with:
          package: zstandard_macos
          mode: restore

      - name: Install CocoaPods dependencies
        if: matrix.dependency_manager == 'cocoapods'
        working-directory: zstandard_macos/example/macos
        run: pod install --verbose

      - name: Build macOS example
        working-directory: zstandard_macos/example
        run: flutter build macos --debug

      - name: Launch macOS example and run integration tests
        working-directory: zstandard_macos/example
        run: |
          bash ../../scripts/run_with_timeout.sh 900 \
            flutter test integration_test/macos_integration_test.dart \
            -d macos --reporter expanded

      - name: Restore workspace native package
        if: always() && matrix.source == 'package-config'
        run: |
          if [[ -d "$RUNNER_TEMP/zstandard-stage/zstandard_native" ]]; then
            mv "$RUNNER_TEMP/zstandard-stage/zstandard_native" zstandard_native
          fi

      - name: Restore Flutter dependency-manager default
        if: always()
        run: flutter config --no-enable-swift-package-manager

  check_macos_publish_dry_run:
    name: Dry Run Publish macOS
    runs-on: [self-hosted, macOS, ARM64]
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803

      - uses: ./.github/actions/preserve-flutter-project-files
        with:
          package: zstandard_macos
          mode: save

      - uses: ./.github/actions/setup-preinstalled-flutter
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}

      - name: Get dependencies
        working-directory: zstandard_macos
        run: flutter pub get

      - uses: ./.github/actions/preserve-flutter-project-files
        with:
          package: zstandard_macos
          mode: restore

      - name: Publish Dry Run
        working-directory: zstandard_macos
        run: dart pub publish --dry-run
