name: PR Check macOS

on:
  pull_request:
    branches:
      - '**'
      - '!master'
  push:
    branches:
      - develop

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Swift Package Manager support requires Flutter 3.44 or newer.
  FLUTTER_VERSION: '3.47.2'

jobs:
  check_macos_analyze:
    name: Analyze macOS
    runs-on: [self-hosted, macOS, ARM64]
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup-flutter
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}

      - name: Get dependencies
        working-directory: zstandard_macos
        run: flutter pub get

      - name: Analyze check
        working-directory: zstandard_macos
        run: flutter analyze

      - name: Run package tests
        working-directory: zstandard_macos
        run: flutter test

  check_macos_test:
    name: Test macOS (${{ matrix.dependency_manager }}, ${{ matrix.source }})
    runs-on: [self-hosted, macOS, ARM64]
    strategy:
      fail-fast: false
      matrix:
        dependency_manager: [swiftpm, cocoapods]
        source: [workspace, pub-cache]
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup-flutter
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}

      - name: Select native dependency manager
        run: |
          if [[ "${{ matrix.dependency_manager }}" == "swiftpm" ]]; then
            flutter config --enable-swift-package-manager
          else
            flutter config --no-enable-swift-package-manager
          fi

      - name: Use checkout for SwiftPM native dependency
        if: matrix.dependency_manager == 'swiftpm' && matrix.source == 'workspace'
        run: echo "ZSTANDARD_NATIVE_PACKAGE_PATH=$GITHUB_WORKSPACE" >> "$GITHUB_ENV"

      - name: Remove workspace native package to force Pub cache resolution
        if: matrix.source == 'pub-cache'
        run: rm -rf zstandard_native

      - name: Clean plugin and example
        run: |
          (cd zstandard_macos && flutter clean)
          (cd zstandard_macos/example && flutter clean)

      - name: Get plugin dependencies
        working-directory: zstandard_macos
        run: flutter pub get

      - name: Get example dependencies
        working-directory: zstandard_macos/example
        run: flutter pub get

      - name: Install CocoaPods dependencies
        if: matrix.dependency_manager == 'cocoapods'
        working-directory: zstandard_macos/example/macos
        run: pod install --verbose

      - name: Run integration tests
        working-directory: zstandard_macos/example
        run: flutter test integration_test/ -d macos

  check_macos_publish_dry_run:
    name: Dry Run Publish macOS
    runs-on: [self-hosted, macOS, ARM64]
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup-flutter
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}

      - name: Get dependencies
        working-directory: zstandard_macos
        run: flutter pub get

      - name: Publish Dry Run
        working-directory: zstandard_macos
        run: dart pub publish --dry-run
