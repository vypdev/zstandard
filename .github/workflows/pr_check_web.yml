name: PR Check Web

on:
  pull_request:
    branches:
      - '**'
      - '!master'
  push:
    branches:
      - develop

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Keep CI aligned with the package constraints. The organisation-level
  # FLUTTER_VERSION variable may intentionally point to an older SDK.
  FLUTTER_VERSION: '3.47.2'

jobs:
  check_web_analyze:
    name: Analyze Web
    runs-on: [self-hosted, Linux]
    steps:
      - uses: actions/checkout@v6

      - uses: ./.github/actions/setup-flutter
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}

      - name: Get dependencies
        working-directory: zstandard_web
        run: flutter pub get

      - name: Analyze check
        working-directory: zstandard_web
        run: flutter analyze

  check_web_test:
    name: Test Web
    runs-on: [self-hosted, Linux]
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6

      - uses: ./.github/actions/setup-linux-dependencies
        with:
          desktop: 'true'

      - uses: ./.github/actions/setup-flutter
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}

      - name: Get dependencies
        working-directory: zstandard_web
        run: flutter pub get

      - name: Get example dependencies
        working-directory: zstandard_web/example
        run: flutter pub get

      - name: Set up Chrome and matching ChromeDriver
        id: chrome
        uses: browser-actions/setup-chrome@v2
        with:
          chrome-version: stable
          install-chromedriver: true
          install-dependencies: true

      - name: Verify browser toolchain
        run: |
          set -euo pipefail
          "${{ steps.chrome.outputs.chrome-path }}" --version
          "${{ steps.chrome.outputs.chromedriver-path }}" --version

      - name: Regenerate WebAssembly from canonical C source
        env:
          # Keep generated artifacts reproducible and reviewable. The script
          # clones this exact official emsdk revision and installs Emscripten
          # 3.1.69 before compiling zstandard_native/src/zstd.
          EMSDK_REF: a36df02dc438e8b02f91122a4c62eeecb6784272
          EMSCRIPTEN_VERSION: '3.1.69'
        run: bash scripts/build_web_wasm.sh

      - name: Verify generated WebAssembly is committed and synchronized
        run: |
          set -euo pipefail
          git diff --check
          git diff --exit-code -- \
            zstandard_web/blob/zstd.js \
            zstandard_web/blob/zstd.wasm \
            zstandard_web/example/web/zstd.js \
            zstandard_web/example/web/zstd.wasm \
            zstandard/example/web/zstd.js \
            zstandard/example/web/zstd.wasm

      - name: Build Web example
        working-directory: zstandard_web/example
        run: flutter build web --release

      - name: Run integration tests (flutter drive + ChromeDriver)
        working-directory: zstandard_web/example
        env:
          CHROME_EXECUTABLE: ${{ steps.chrome.outputs.chrome-path }}
        run: |
          set -euo pipefail
          # ChromeDriver and Flutter must share the same display. Keeping the
          # whole WebDriver session inside Xvfb also works on headless runners.
          xvfb-run --auto-servernum --server-args="-screen 0 1920x1080x24" bash -c '
            set -euo pipefail
            DRIVER_LOG="$RUNNER_TEMP/chromedriver.log"
            chromedriver --port=4444 > "$DRIVER_LOG" 2>&1 &
            DRIVER_PID=$!
            cleanup() {
              kill "$DRIVER_PID" 2>/dev/null || true
              wait "$DRIVER_PID" 2>/dev/null || true
            }
            trap cleanup EXIT
            for attempt in {1..20}; do
              if curl --silent --fail http://127.0.0.1:4444/status >/dev/null; then
                break
              fi
              sleep 1
            done
            if ! curl --silent --fail http://127.0.0.1:4444/status >/dev/null; then
              cat "$DRIVER_LOG"
              exit 1
            fi
            set +e
            flutter drive \
              --driver=test_driver/integration_test.dart \
              --target=integration_test/zstandard_web_integration_test.dart \
              --driver-port=4444 \
              --chrome-binary="$CHROME_EXECUTABLE" \
              --web-browser-flag=--disable-dev-shm-usage \
              --web-browser-flag=--disable-gpu \
              -d web-server \
              --web-port=8080
            DRIVE_EXIT=$?
            cat "$DRIVER_LOG"
            exit "$DRIVE_EXIT"
          '

  check_web_publish_dry_run:
    name: Dry Run Publish Web
    runs-on: [self-hosted, Linux]
    steps:
      - uses: actions/checkout@v6

      - uses: ./.github/actions/preserve-flutter-project-files
        with:
          package: zstandard_web
          mode: save

      - uses: ./.github/actions/setup-flutter
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}

      - name: Get dependencies
        working-directory: zstandard_web
        run: flutter pub get

      - uses: ./.github/actions/preserve-flutter-project-files
        with:
          package: zstandard_web
          mode: restore

      - name: Publish Dry Run
        working-directory: zstandard_web
        run: dart pub publish --dry-run
