name: PR Check CLI

on:
  push:
    branches:
      - develop
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Keep CI aligned with the repository toolchain. The organisation-level
  # FLUTTER_VERSION variable may intentionally point to an older SDK.
  FLUTTER_VERSION: '3.47.2'

jobs:
  check_cli_analyze:
    name: Analyze CLI
    runs-on: [self-hosted, Linux]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803

      - uses: ./.github/actions/setup-flutter
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}

      - name: Resolve workspace dependencies
        run: dart scripts/create_local_overrides.dart zstandard_cli

      - name: Get dependencies
        working-directory: zstandard_cli
        run: dart pub get

      - name: Analyze check
        working-directory: zstandard_cli
        run: dart analyze

  check_cli_test:
    name: Test CLI
    runs-on: [self-hosted, Linux]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803

      - uses: ./.github/actions/setup-linux-dependencies

      - uses: ./.github/actions/setup-flutter
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}

      - name: Resolve workspace dependencies
        run: dart scripts/create_local_overrides.dart zstandard_cli

      - name: Get dependencies
        working-directory: zstandard_cli
        run: dart pub get

      - name: Test check
        working-directory: zstandard_cli
        run: dart test --coverage=coverage

      - name: Format coverage to lcov
        working-directory: zstandard_cli
        run: >-
          dart run coverage:format_coverage --lcov -i coverage
          -o coverage/lcov.info --packages=.dart_tool/package_config.json
          --report-on=lib

      # Coverage threshold: this package's lib/ only.
      - name: Check coverage threshold (95% of lib/)
        working-directory: zstandard_cli
        run: dart ../scripts/check_lcov_coverage.dart coverage/lcov.info 95

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: zstandard_cli/coverage/lcov.info
          flags: cli
          disable_search: true
          fail_ci_if_error: true

      - name: Run benchmarks (informational)
        working-directory: zstandard_cli
        run: dart run benchmark/benchmark_suite.dart --output=benchmark_results.json || true

      - name: Check Linux performance regression (if baseline exists)
        working-directory: zstandard_cli
        run: |
          if [ -f benchmark/baselines/baseline_linux_x64.json ]; then
            dart run ../../scripts/check_performance_regression.dart \
              --baseline=benchmark/baselines/baseline_linux_x64.json \
              --current=benchmark_results.json \
              --threshold=0.10 || true
          else
            echo "No Linux baseline found; skipping performance regression check."
          fi

  check_cli_publish_dry_run:
    name: Dry Run Publish CLI
    runs-on: [self-hosted, Linux]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803

      - uses: ./.github/actions/setup-flutter
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}

      - name: Resolve workspace dependencies
        run: dart scripts/create_local_overrides.dart zstandard_cli

      - name: Get dependencies
        working-directory: zstandard_cli
        run: dart pub get

      - name: Publish Dry Run
        working-directory: zstandard_cli
        run: dart pub publish --dry-run
