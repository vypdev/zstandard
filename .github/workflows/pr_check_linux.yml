name: PR Check Linux

on:
  pull_request:
    branches:
      - '**'
      - '!master'
  push:
    branches:
      - develop

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Keep CI aligned with the package constraints. The organisation-level
  # FLUTTER_VERSION variable may intentionally point to an older SDK.
  FLUTTER_VERSION: '3.47.2'

jobs:
  check_linux_analyze:
    name: Analyze Linux
    runs-on: [self-hosted, Linux]
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v1
        with:
          channel: 'stable'
          flutter-version: ${{ env.FLUTTER_VERSION }}

      - name: Get dependencies
        working-directory: zstandard_linux
        run: flutter pub get

      - name: Analyze check
        working-directory: zstandard_linux
        run: flutter analyze

  check_linux_test:
    name: Test Linux
    runs-on: [self-hosted, Linux]
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup-linux-dependencies
        with:
          desktop: 'true'

      - uses: subosito/flutter-action@v1
        with:
          channel: 'stable'
          flutter-version: ${{ env.FLUTTER_VERSION }}

      - name: Get dependencies
        working-directory: zstandard_linux
        run: flutter pub get

      - name: Clean example
        working-directory: zstandard_linux/example
        run: flutter clean

      - name: Get example dependencies
        working-directory: zstandard_linux/example
        run: flutter pub get

      - name: Build Linux example
        working-directory: zstandard_linux/example
        run: flutter build linux --debug

      - name: Run integration tests
        working-directory: zstandard_linux/example
        run: xvfb-run --auto-servernum --server-args='-screen 0 1920x1080x24' flutter test integration_test/ -d linux

  check_linux_test_from_pub_cache:
    name: Test Linux (from pub cache)
    runs-on: [self-hosted, Linux]
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup-linux-dependencies
        with:
          desktop: 'true'

      - uses: subosito/flutter-action@v1
        with:
          channel: 'stable'
          flutter-version: ${{ env.FLUTTER_VERSION }}

      - name: Remove zstandard_native to force resolution from pub cache
        run: rm -rf zstandard_native

      - name: Clean and get dependencies (force pub cache)
        working-directory: zstandard_linux
        run: |
          flutter clean
          flutter pub get

      - name: Get dependencies in example (force pub cache)
        working-directory: zstandard_linux/example
        run: |
          flutter clean
          flutter pub get

      - name: Build Linux example from pub cache
        working-directory: zstandard_linux/example
        run: flutter build linux --debug

      - name: Run integration tests (C sources from pub cache)
        working-directory: zstandard_linux/example
        run: xvfb-run --auto-servernum --server-args='-screen 0 1920x1080x24' flutter test integration_test/ -d linux

  check_linux_publish_dry_run:
    name: Dry Run Publish Linux
    runs-on: [self-hosted, Linux]
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/preserve-flutter-project-files
        with:
          package: zstandard_linux
          mode: save

      - uses: subosito/flutter-action@v1
        with:
          channel: 'stable'
          flutter-version: ${{ env.FLUTTER_VERSION }}

      - name: Get dependencies
        working-directory: zstandard_linux
        run: flutter pub get

      - uses: ./.github/actions/preserve-flutter-project-files
        with:
          package: zstandard_linux
          mode: restore

      - name: Publish Dry Run
        working-directory: zstandard_linux
        run: dart pub publish --dry-run
