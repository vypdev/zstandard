name: PR Check Linux

on:
  push:
    branches:
      - develop
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Keep CI aligned with the package constraints. The organisation-level
  # FLUTTER_VERSION variable may intentionally point to an older SDK.
  FLUTTER_VERSION: '3.47.2'

jobs:
  check_linux_analyze:
    name: Analyze Linux
    runs-on: [self-hosted, Linux]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803

      - uses: ./.github/actions/setup-flutter
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}

      - name: Resolve workspace dependencies
        run: dart scripts/create_local_overrides.dart zstandard_linux

      - name: Get dependencies
        working-directory: zstandard_linux
        run: flutter pub get

      - name: Analyze check
        working-directory: zstandard_linux
        run: flutter analyze

  check_linux_test:
    name: Test Linux
    runs-on: [self-hosted, Linux]
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803

      - uses: ./.github/actions/setup-linux-dependencies
        with:
          desktop: 'true'

      - uses: ./.github/actions/setup-flutter
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}

      - name: Resolve workspace dependencies
        run: dart scripts/create_local_overrides.dart zstandard_linux

      - name: Get dependencies
        working-directory: zstandard_linux
        run: flutter pub get

      - name: Clean example
        working-directory: zstandard_linux/example
        run: flutter clean

      - name: Get example dependencies
        working-directory: zstandard_linux/example
        run: flutter pub get

      - name: Build Linux example
        working-directory: zstandard_linux/example
        run: flutter build linux --debug

      - name: Build and run Linux native tests
        working-directory: zstandard_linux/example
        run: |
          set -euo pipefail
          cmake_build_dir=$(find build/linux -type f -name CMakeCache.txt \
            -not -path '*/_deps/*' -print \
            | sed 's#/CMakeCache.txt$##' | sort | tail -n 1)
          test -n "$cmake_build_dir"
          ZSTANDARD_LINUX_ENABLE_TESTS=1 cmake -S linux -B "$cmake_build_dir"
          cmake --build "$cmake_build_dir" --target zstandard_linux_test --parallel
          ctest --test-dir "$cmake_build_dir" --output-on-failure

      - name: Run integration tests
        working-directory: zstandard_linux/example
        run: xvfb-run --auto-servernum --server-args='-screen 0 1920x1080x24' flutter test integration_test/ -d linux

  check_linux_test_from_package_config:
    name: Test Linux (exact package-config source)
    runs-on: [self-hosted, Linux]
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803

      - uses: ./.github/actions/setup-linux-dependencies
        with:
          desktop: 'true'

      - uses: ./.github/actions/setup-flutter
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}

      - name: Stage zstandard_native outside the repository
        run: |
          mkdir -p "$RUNNER_TEMP/zstandard-stage"
          mv zstandard_native "$RUNNER_TEMP/zstandard-stage/zstandard_native"
          dart scripts/create_local_overrides.dart zstandard_linux \
            "$RUNNER_TEMP/zstandard-stage/zstandard_native"

      - name: Clean and get dependencies from package_config
        working-directory: zstandard_linux
        run: |
          flutter clean
          flutter pub get

      - name: Get dependencies in example from package_config
        working-directory: zstandard_linux/example
        run: |
          flutter clean
          flutter pub get

      - name: Build Linux example from package_config
        working-directory: zstandard_linux/example
        run: flutter build linux --debug

      - name: Build and run Linux native tests from package_config
        working-directory: zstandard_linux/example
        run: |
          set -euo pipefail
          cmake_build_dir=$(find build/linux -type f -name CMakeCache.txt \
            -not -path '*/_deps/*' -print \
            | sed 's#/CMakeCache.txt$##' | sort | tail -n 1)
          test -n "$cmake_build_dir"
          ZSTANDARD_LINUX_ENABLE_TESTS=1 cmake -S linux -B "$cmake_build_dir"
          cmake --build "$cmake_build_dir" --target zstandard_linux_test --parallel
          ctest --test-dir "$cmake_build_dir" --output-on-failure

      - name: Run integration tests (C source from package_config)
        working-directory: zstandard_linux/example
        run: xvfb-run --auto-servernum --server-args='-screen 0 1920x1080x24' flutter test integration_test/ -d linux

      - name: Restore workspace native package
        if: always()
        run: |
          if [[ -d "$RUNNER_TEMP/zstandard-stage/zstandard_native" ]]; then
            mv "$RUNNER_TEMP/zstandard-stage/zstandard_native" zstandard_native
          fi

  check_linux_publish_dry_run:
    name: Dry Run Publish Linux
    runs-on: [self-hosted, Linux]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803

      - uses: ./.github/actions/preserve-flutter-project-files
        with:
          package: zstandard_linux
          mode: save

      - uses: ./.github/actions/setup-flutter
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}

      - name: Resolve workspace dependencies
        run: dart scripts/create_local_overrides.dart zstandard_linux

      - name: Get dependencies
        working-directory: zstandard_linux
        run: flutter pub get

      - uses: ./.github/actions/preserve-flutter-project-files
        with:
          package: zstandard_linux
          mode: restore

      - name: Publish Dry Run
        working-directory: zstandard_linux
        run: dart pub publish --dry-run
