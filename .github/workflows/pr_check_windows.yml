name: PR Check Windows

on:
  push:
    branches:
      - develop
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Keep Windows aligned with the Flutter SDK used by the other platform jobs.
  FLUTTER_VERSION: '3.47.2'


jobs:
  check_windows_analyze:
    name: Analyze Windows
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803

      - uses: ./.github/actions/setup-preinstalled-flutter-windows
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}

      - name: Resolve workspace dependencies
        shell: cmd
        run: call dart scripts\create_local_overrides.dart zstandard_windows

      - name: Get dependencies
        working-directory: zstandard_windows
        shell: cmd
        run: call flutter pub get

      - name: Analyze check
        working-directory: zstandard_windows
        shell: cmd
        run: call flutter analyze

  check_windows_test:
    name: Test Windows
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803

      - uses: ./.github/actions/setup-preinstalled-flutter-windows
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}

      - name: Resolve workspace dependencies
        shell: cmd
        run: call dart scripts\create_local_overrides.dart zstandard_windows

      - name: Get dependencies
        working-directory: zstandard_windows
        shell: cmd
        run: call flutter pub get

      - name: Clean example
        working-directory: zstandard_windows/example
        shell: cmd
        run: call flutter clean

      - name: Get example dependencies
        working-directory: zstandard_windows/example
        shell: cmd
        run: call flutter pub get

      - name: Build Windows example
        working-directory: zstandard_windows/example
        shell: cmd
        run: call flutter build windows --debug

      - name: Run Windows native C++ tests
        working-directory: zstandard_windows/example
        shell: cmd
        run: |
          @echo off
          set "BUILD_DIR=build\windows\x64"
          if not exist "%BUILD_DIR%\CMakeCache.txt" (
            echo Flutter did not generate a Windows CMake build directory.
            exit /b 1
          )
          cmake --build "%BUILD_DIR%" --config Debug --target zstandard_windows_test --parallel
          set "TEST_EXE=%BUILD_DIR%\plugins\zstandard_windows\Debug\zstandard_windows_test.exe"
          if not exist "%TEST_EXE%" (
            echo The Windows native test executable was not produced by the build.
            exit /b 1
          )
          "%TEST_EXE%"
          if errorlevel 1 exit /b 1

      - name: Run Windows package tests against the built DLL
        shell: cmd
        run: |
          @echo off
          set "DLL_DIR=%CD%\zstandard_windows\example\build\windows\x64\runner\Debug"
          if not exist "%DLL_DIR%\zstandard_windows.dll" (
            echo The Windows zstandard DLL was not produced by the build.
            exit /b 1
          )
          set "PATH=%DLL_DIR%;%PATH%"
          pushd zstandard_windows
          call flutter test test --coverage
          set "EXIT_CODE=%ERRORLEVEL%"
          popd
          exit /b %EXIT_CODE%

      - name: Launch Windows example and run integration tests
        working-directory: zstandard_windows/example
        shell: cmd
        run: call flutter test integration_test/windows_integration_test.dart -d windows

  check_windows_test_from_package_config:
    name: Test Windows (exact package-config source)
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803

      - uses: ./.github/actions/setup-preinstalled-flutter-windows
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}

      - name: Stage zstandard_native outside the repository
        shell: cmd
        run: |
          @echo off
          set "STAGE=%RUNNER_TEMP%\zstandard-stage"
          if not exist "%STAGE%" mkdir "%STAGE%"
          move zstandard_native "%STAGE%\zstandard_native"
          if errorlevel 1 exit /b %ERRORLEVEL%
          call dart scripts\create_local_overrides.dart zstandard_windows "%STAGE%\zstandard_native"
          if errorlevel 1 exit /b %ERRORLEVEL%

      - name: Clean and get dependencies from package_config
        working-directory: zstandard_windows
        shell: cmd
        run: |
          call flutter clean
          call flutter pub get

      - name: Get dependencies in example from package_config
        working-directory: zstandard_windows/example
        shell: cmd
        run: |
          call flutter clean
          call flutter pub get

      - name: Build Windows example from package_config
        working-directory: zstandard_windows/example
        shell: cmd
        run: call flutter build windows --debug

      - name: Run Windows native C++ tests from package_config
        working-directory: zstandard_windows/example
        shell: cmd
        run: |
          @echo off
          set "BUILD_DIR=build\windows\x64"
          if not exist "%BUILD_DIR%\CMakeCache.txt" (
            echo Flutter did not generate a Windows CMake build directory.
            exit /b 1
          )
          cmake --build "%BUILD_DIR%" --config Debug --target zstandard_windows_test --parallel
          set "TEST_EXE=%BUILD_DIR%\plugins\zstandard_windows\Debug\zstandard_windows_test.exe"
          if not exist "%TEST_EXE%" (
            echo The Windows native test executable was not produced by the build.
            exit /b 1
          )
          "%TEST_EXE%"
          if errorlevel 1 exit /b 1

      - name: Run Windows package tests against the package-config DLL
        shell: cmd
        run: |
          @echo off
          set "DLL_DIR=%CD%\zstandard_windows\example\build\windows\x64\runner\Debug"
          if not exist "%DLL_DIR%\zstandard_windows.dll" (
            echo The Windows zstandard DLL was not produced by the build.
            exit /b 1
          )
          set "PATH=%DLL_DIR%;%PATH%"
          pushd zstandard_windows
          call flutter test test --coverage
          set "EXIT_CODE=%ERRORLEVEL%"
          popd
          exit /b %EXIT_CODE%

      - name: Launch Windows example and run package-config integration tests
        working-directory: zstandard_windows/example
        shell: cmd
        run: call flutter test integration_test/windows_integration_test.dart -d windows

      - name: Restore workspace native package
        if: always()
        shell: cmd
        run: |
          @echo off
          if exist "%RUNNER_TEMP%\zstandard-stage\zstandard_native" move "%RUNNER_TEMP%\zstandard-stage\zstandard_native" zstandard_native

  check_windows_federated_example:
    name: Test federated Windows example
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803

      - uses: ./.github/actions/setup-preinstalled-flutter-windows
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}

      - name: Clean and get federated example dependencies
        working-directory: zstandard/example
        shell: cmd
        run: |
          call flutter clean
          call flutter pub get

      - name: Build federated Windows example
        working-directory: zstandard/example
        shell: cmd
        run: call flutter build windows --debug

      - name: Launch federated Windows example and run integration tests
        working-directory: zstandard/example
        shell: cmd
        run: call flutter test integration_test/ -d windows

  check_windows_publish_dry_run:
    name: Dry Run Publish Windows
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803

      - uses: ./.github/actions/setup-preinstalled-flutter-windows
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}

      - name: Resolve workspace dependencies
        shell: cmd
        run: call dart scripts\create_local_overrides.dart zstandard_windows

      - name: Get dependencies
        working-directory: zstandard_windows
        shell: cmd
        run: call flutter pub get

      - name: Publish Dry Run
        working-directory: zstandard_windows
        shell: cmd
        run: call dart pub publish --dry-run
