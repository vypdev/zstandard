name: Diagnose macOS Flutter runner

on:
  workflow_dispatch:
    inputs:
      run_full_flutter_setup:
        description: 'Run the full Flutter setup action after the probes (downloads about 2 GB on a cold runner)'
        required: true
        default: false
        type: boolean

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

env:
  FLUTTER_VERSION: '3.47.2'

jobs:
  diagnose_macos_flutter:
    name: Diagnose macOS Flutter download
    runs-on: [self-hosted, macOS, ARM64]
    timeout-minutes: 20

    steps:
      - name: Inspect runner context
        shell: bash
        run: |
          set -u

          echo "Runner name: ${RUNNER_NAME:-unset}"
          echo "Runner OS: ${RUNNER_OS:-unset}"
          echo "Runner architecture: ${RUNNER_ARCH:-unset}"
          echo "User: $(id -un)"
          echo "Host: $(hostname)"
          echo "uname -a: $(uname -a)"
          echo "uname -m: $(uname -m)"
          echo "arch: $(arch)"
          echo "Rosetta translation: $(sysctl -n sysctl.proc_translated 2>/dev/null || echo unavailable)"
          echo "PATH: $PATH"
          echo "RUNNER_TEMP: ${RUNNER_TEMP:-unset}"
          echo "RUNNER_TOOL_CACHE: ${RUNNER_TOOL_CACHE:-unset}"

          echo 'curl binaries:'
          type -a curl || true
          echo 'selected curl:'
          command -v curl || true
          curl --version || true

          echo 'proxy variables (values intentionally hidden):'
          for variable in HTTP_PROXY HTTPS_PROXY ALL_PROXY NO_PROXY http_proxy https_proxy all_proxy no_proxy; do
            if printenv "$variable" >/dev/null 2>&1; then
              echo "$variable=<set>"
            else
              echo "$variable=<unset>"
            fi
          done

          echo 'macOS proxy enablement:'
          scutil --proxy | grep -E '^(HTTPEnable|HTTPSEnable|SOCKSEnable|ProxyAutoConfigEnable|ProxyAutoDiscoveryEnable)' || true

          echo 'filesystem:'
          df -h "$RUNNER_TEMP" /tmp
          if [[ -n "${RUNNER_TOOL_CACHE:-}" ]]; then
            df -h "$RUNNER_TOOL_CACHE"
          fi

      - name: Probe Flutter archive from the runner service
        shell: bash
        run: |
          set -u

          URL="https://storage.googleapis.com/flutter_infra_release/releases/stable/macos/flutter_macos_arm64_${FLUTTER_VERSION}-stable.zip"
          TEST_FILE="$RUNNER_TEMP/flutter-download-test.part"

          probe() {
            label="$1"
            destination="$2"
            shift 2

            echo "::group::$label"
            echo "URL: $URL"
            echo "Destination: $destination"
            date -u '+Started: %Y-%m-%dT%H:%M:%SZ'

            set +e
            curl --connect-timeout 15 \
              --retry 5 \
              --range 0-33554431 \
              "$@" \
              -o "$destination" \
              -w '\nHTTP: %{http_code}\nDownloaded: %{size_download} bytes\nSpeed: %{speed_download} bytes/s\n' \
              "$URL"
            status=$?
            set -e

            echo "curl exit code: $status"
            if [[ "$destination" != "/dev/null" && -f "$destination" ]]; then
              ls -lh "$destination"
            fi
            date -u '+Finished: %Y-%m-%dT%H:%M:%SZ'
            echo '::endgroup::'
            return 0
          }

          probe 'Default curl to /dev/null' /dev/null
          probe 'Default curl to RUNNER_TEMP' "$TEST_FILE"
          probe 'IPv4 curl to /dev/null' /dev/null --ipv4
          probe 'IPv6 curl to /dev/null' /dev/null --ipv6

      - name: Check Flutter tool cache before optional setup
        shell: bash
        run: |
          set -u

          if [[ -n "${RUNNER_TOOL_CACHE:-}" ]]; then
            find "$RUNNER_TOOL_CACHE/flutter" \
              -maxdepth 5 \
              -type f \
              -path "*/${FLUTTER_VERSION}-*/bin/flutter" \
              -print 2>/dev/null || true
          else
            echo 'RUNNER_TOOL_CACHE is not set'
          fi

      - name: Check out repository for optional full setup
        if: inputs.run_full_flutter_setup == true
        uses: actions/checkout@v4

      - name: Run full Flutter setup action
        if: inputs.run_full_flutter_setup == true
        uses: ./.github/actions/setup-flutter
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}

      - name: Verify full Flutter setup
        if: inputs.run_full_flutter_setup == true
        shell: bash
        run: |
          set -euo pipefail
          command -v flutter
          flutter --version
