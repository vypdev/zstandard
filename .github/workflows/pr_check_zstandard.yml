name: PR Check Zstandard

on:
  pull_request:
    branches:
      - '**'
      - '!master'
  push:
    branches:
      - develop

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Keep CI aligned with the package constraints. The organisation-level
  # FLUTTER_VERSION variable may intentionally point to an older SDK.
  FLUTTER_VERSION: '3.47.2'

jobs:
  check_zstandard_analyze:
    name: Analyze Zstandard
    runs-on: [self-hosted, Linux]
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v1
        with:
          channel: 'stable'
          flutter-version: ${{ env.FLUTTER_VERSION }}

      - name: Get dependencies
        working-directory: zstandard
        run: flutter pub get

      - name: Analyze check
        working-directory: zstandard
        run: flutter analyze

  check_zstandard_test:
    name: Test Zstandard
    runs-on: [self-hosted, Linux]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup-linux-dependencies
        with:
          coverage: 'true'

      - uses: subosito/flutter-action@v1
        with:
          channel: 'stable'
          flutter-version: ${{ env.FLUTTER_VERSION }}

      - name: Get dependencies
        working-directory: zstandard
        run: flutter pub get

      - name: Test check
        working-directory: zstandard
        run: flutter test --coverage

      # Coverage threshold: lib/ only (same pattern as CLI and platform_interface)
      - name: Check coverage threshold (76% of lib/)
        working-directory: zstandard
        run: |
          lcov --extract coverage/lcov.info 'lib/*' -o coverage/lcov_lib.info
          COVERAGE=$(lcov --summary coverage/lcov_lib.info 2>&1 | grep "lines" | awk '{print $2}' | sed 's/%//')
          echo "Coverage (lib/ only): ${COVERAGE}%"
          if [ -z "$COVERAGE" ]; then
            echo "Could not parse coverage"
            exit 1
          fi
          if (( $(echo "$COVERAGE < 76" | bc -l) )); then
            echo "ERROR: Coverage ${COVERAGE}% is below 76% threshold"
            exit 1
          fi

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: zstandard/coverage/lcov.info
          flags: zstandard
          fail_ci_if_error: true

  check_zstandard_publish_dry_run:
    name: Dry Run Publish Zstandard
    runs-on: [self-hosted, Linux]
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/preserve-flutter-project-files
        with:
          package: zstandard
          mode: save

      - uses: subosito/flutter-action@v1
        with:
          channel: 'stable'
          flutter-version: ${{ env.FLUTTER_VERSION }}

      - name: Get dependencies
        working-directory: zstandard
        run: flutter pub get

      - uses: ./.github/actions/preserve-flutter-project-files
        with:
          package: zstandard
          mode: restore

      - name: Publish Dry Run
        working-directory: zstandard
        run: dart pub publish --dry-run
