name: PR Check Zstandard

on:
  push:
    branches:
      - develop
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Keep CI aligned with the package constraints. The organisation-level
  # FLUTTER_VERSION variable may intentionally point to an older SDK.
  FLUTTER_VERSION: '3.47.2'

jobs:
  check_zstandard_analyze:
    name: Analyze Zstandard
    runs-on: [self-hosted, Linux]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803

      - uses: ./.github/actions/setup-flutter
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}

      - name: Resolve workspace dependencies
        run: dart scripts/create_local_overrides.dart zstandard

      - name: Verify publication metadata
        run: dart scripts/check_pub_metadata.dart

      - name: Get dependencies
        working-directory: zstandard
        run: flutter pub get

      - name: Analyze check
        working-directory: zstandard
        run: flutter analyze

  check_zstandard_test:
    name: Test Zstandard
    runs-on: [self-hosted, Linux]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803

      - uses: ./.github/actions/setup-linux-dependencies

      - uses: ./.github/actions/setup-flutter
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}

      - name: Resolve workspace dependencies
        run: dart scripts/create_local_overrides.dart zstandard

      - name: Get dependencies
        working-directory: zstandard
        run: flutter pub get

      - name: Test check
        working-directory: zstandard
        run: flutter test --coverage

      # Coverage threshold: lib/ only (same pattern as CLI and platform_interface)
      - name: Check coverage threshold (76% of lib/)
        working-directory: zstandard
        run: dart ../scripts/check_lcov_coverage.dart coverage/lcov.info 76

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@b9fd7d16f6d7d1b5d2bec1a2887e65ceed900238
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: zstandard/coverage/lcov.info
          flags: zstandard
          disable_search: true
          fail_ci_if_error: true

  check_zstandard_publish_dry_run:
    name: Dry Run Publish Zstandard
    runs-on: [self-hosted, Linux]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803

      - uses: ./.github/actions/preserve-flutter-project-files
        with:
          package: zstandard
          mode: save

      - uses: ./.github/actions/setup-flutter
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}

      - name: Resolve workspace dependencies
        run: dart scripts/create_local_overrides.dart zstandard

      - name: Get dependencies
        working-directory: zstandard
        run: flutter pub get

      - uses: ./.github/actions/preserve-flutter-project-files
        with:
          package: zstandard
          mode: restore

      - name: Publish Dry Run
        working-directory: zstandard
        run: dart pub publish --dry-run
