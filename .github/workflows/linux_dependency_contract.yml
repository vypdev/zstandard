name: Linux private dependency contract
on:
  pull_request:
    paths:
      - .github/actions/setup-linux-dependencies/**
      - .github/actions/copilot-verification-setup/linux-dependencies.sh
      - .github/scripts/tests/verify_linux_prefix.sh
      - .github/workflows/linux_dependency_contract.yml
permissions:
  contents: read
jobs:
  private-prefix:
    name: Rootless Linux native toolchain (${{ matrix.ubuntu }})
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on:
      group: vypdev
      labels: [self-hosted, macOS, ARM64]
    timeout-minutes: 10
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        ubuntu: ['22.04', '24.04']
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Extract the real action script into a private fixture
        shell: bash
        run: |
          set -euo pipefail
          state="$(mktemp -d "$RUNNER_TEMP/zstandard-linux-contract.XXXXXX")"
          cp .github/actions/copilot-verification-setup/linux-dependencies.sh "$state/action.sh"
          cp .github/scripts/tests/verify_linux_prefix.sh "$state/check.sh"
          echo "LINUX_CONTRACT_STATE=$state" >> "$GITHUB_ENV"
      - name: Execute without privileges or a host Docker socket
        shell: bash
        env:
          UBUNTU_VERSION: ${{ matrix.ubuntu }}
        run: |
          set -euo pipefail
          docker_host="$(docker context inspect --format '{{.Endpoints.docker.Host}}')"
          docker_config="$(mktemp -d "$RUNNER_TEMP/zstandard-contract-docker.XXXXXX")"
          printf '{"auths":{"job-credentials.invalid":{}}}\n' > "$docker_config/config.json"
          chmod 600 "$docker_config/config.json"
          DOCKER_HOST="$docker_host" DOCKER_CONTEXT='' DOCKER_AUTH_CONFIG='' DOCKER_CONFIG="$docker_config" \
            docker run --rm --platform linux/amd64 --cpus 1 --memory 4g --user 1000:1000 \
              -e HOME=/tmp -v "$LINUX_CONTRACT_STATE:/contract:ro" "ubuntu:$UBUNTU_VERSION" \
              /bin/bash /contract/check.sh
