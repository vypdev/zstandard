name: Task - Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version; it must match release/x.y.z'
        required: true
        type: string
        default: '1.5.1'
      title:
        description: 'Release title'
        required: true
        type: string
        default: 'New Version'
      changelog:
        description: 'Release summary'
        required: true
        type: string
        default: '- Several improvements'
      issue:
        description: 'Optional launcher issue reference'
        required: false
        type: string
        default: '-1'
      resume:
        description: 'Resume a partial release whose tag already exists'
        required: true
        type: boolean
        default: false

concurrency:
  # Publishing is irreversible and must never be cancelled by a newer run.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

permissions:
  contents: read

env:
  # This version is installed on Linux through setup-flutter and verified on
  # the persistent Apple Silicon/Windows runners by the local setup actions.
  FLUTTER_VERSION: '3.47.2'
  EMSDK_REF: 'a36df02dc438e8b02f91122a4c62eeecb6784272'
  EMSCRIPTEN_VERSION: '3.1.69'

jobs:
  update_files:
    name: Prepare release candidate
    runs-on: [self-hosted, macOS, ARM64]
    timeout-minutes: 60
    permissions:
      contents: write
    outputs:
      release_tag: ${{ steps.context.outputs.release_tag }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0
          persist-credentials: true

      - name: Validate release branch, version and tag state
        id: context
        env:
          VERSION: ${{ inputs.version }}
          RESUME: ${{ inputs.resume }}
        run: |
          set -euo pipefail
          if [[ ! "$GITHUB_REF_NAME" =~ ^release/[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "This workflow only runs from release/x.y.z branches; got $GITHUB_REF_NAME" >&2
            exit 1
          fi
          if [[ "${GITHUB_REF_NAME#release/}" != "$VERSION" ]]; then
            echo "Version $VERSION does not match branch $GITHUB_REF_NAME" >&2
            exit 1
          fi
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Version must be stable SemVer (x.y.z): $VERSION" >&2
            exit 1
          fi

          git fetch origin --tags --force
          tag="v$VERSION"
          if git ls-remote --exit-code --tags origin "refs/tags/$tag" >/dev/null 2>&1; then
            if [[ "$RESUME" != 'true' ]]; then
              echo "Tag $tag already exists. Set resume=true only for a partial release." >&2
              exit 1
            fi
            echo "Resuming the existing immutable tag $tag."
          elif [[ "$RESUME" == 'true' ]]; then
            echo "Cannot resume: tag $tag does not exist on origin." >&2
            exit 1
          fi
          echo "release_tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Verify preinstalled Flutter
        if: ${{ !inputs.resume }}
        uses: ./.github/actions/setup-preinstalled-flutter
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}

      - name: Update root CHANGELOG.md
        if: ${{ !inputs.resume }}
        env:
          VERSION: ${{ inputs.version }}
          TITLE: ${{ inputs.title }}
          CHANGELOG_BODY: ${{ inputs.changelog }}
        run: |
          set -euo pipefail
          if ! grep -Fq "## $VERSION - $TITLE" CHANGELOG.md; then
            {
              echo "## $VERSION - $TITLE"
              echo
              printf '%s\n' "$CHANGELOG_BODY"
              echo
              cat CHANGELOG.md
            } > CHANGELOG.md.new
            mv CHANGELOG.md.new CHANGELOG.md
          fi

      - name: Copy CHANGELOG.md to all published packages
        if: ${{ !inputs.resume }}
        run: |
          set -euo pipefail
          for package in \
            zstandard_platform_interface zstandard_native zstandard_android \
            zstandard_ios zstandard_macos zstandard_windows zstandard_linux \
            zstandard_web zstandard_cli zstandard; do
            cp CHANGELOG.md "$package/CHANGELOG.md"
          done

      - name: Update package, SwiftPM and CocoaPods versions
        if: ${{ !inputs.resume }}
        env:
          VERSION: ${{ inputs.version }}
        run: dart run .github/scripts/update_versions.dart "$VERSION" --release

      - name: Regenerate WebAssembly from canonical C source
        if: ${{ !inputs.resume }}
        env:
          # The script uses this only for the read-only emsdk fetch.
          GITHUB_TOKEN: ${{ github.token }}
        run: bash scripts/build_web_wasm.sh

      - name: Validate release metadata and generated artifacts
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          printf 'dependency_overrides:\n  zstandard_native:\n    path: ../zstandard_native\n' > zstandard_cli/pubspec_overrides.yaml
          trap 'rm -f zstandard_cli/pubspec_overrides.yaml' EXIT
          dart scripts/check_pub_metadata.dart --release-version "$VERSION"
          git diff --check
          for generated in \
            zstandard_web/blob/zstd.js \
            zstandard_web/example/web/zstd.js \
            zstandard/example/web/zstd.js; do
            test -s "$generated"
          done
          for generated in \
            zstandard_web/blob/zstd.wasm \
            zstandard_web/example/web/zstd.wasm \
            zstandard/example/web/zstd.wasm; do
            test -s "$generated"
          done
          cmp zstandard_web/blob/zstd.js zstandard_web/example/web/zstd.js
          cmp zstandard_web/blob/zstd.js zstandard/example/web/zstd.js
          cmp zstandard_web/blob/zstd.wasm zstandard_web/example/web/zstd.wasm
          cmp zstandard_web/blob/zstd.wasm zstandard/example/web/zstd.wasm

      - name: Commit and push release preparation
        if: ${{ !inputs.resume }}
        env:
          VERSION: ${{ inputs.version }}
          RELEASE_BRANCH: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          git config user.name 'GitHub Actions'
          git config user.email 'actions@github.com'
          git add -- \
            CHANGELOG.md \
            zstandard/pubspec.yaml zstandard/CHANGELOG.md \
            zstandard_android/pubspec.yaml zstandard_android/CHANGELOG.md \
            zstandard_cli/pubspec.yaml zstandard_cli/CHANGELOG.md \
            zstandard_ios/pubspec.yaml zstandard_ios/CHANGELOG.md \
            zstandard_ios/ios/zstandard_ios/Package.swift \
            zstandard_ios/ios/zstandard_ios.podspec \
            zstandard_linux/pubspec.yaml zstandard_linux/CHANGELOG.md \
            zstandard_macos/pubspec.yaml zstandard_macos/CHANGELOG.md \
            zstandard_macos/macos/zstandard_macos/Package.swift \
            zstandard_macos/macos/zstandard_macos.podspec \
            zstandard_native/pubspec.yaml zstandard_native/CHANGELOG.md \
            zstandard_platform_interface/pubspec.yaml zstandard_platform_interface/CHANGELOG.md \
            zstandard_web/pubspec.yaml zstandard_web/CHANGELOG.md \
            zstandard_web/blob/zstd.js zstandard_web/blob/zstd.wasm \
            zstandard_web/example/web/zstd.js zstandard_web/example/web/zstd.wasm \
            zstandard/example/web/zstd.js zstandard/example/web/zstd.wasm \
            zstandard_windows/pubspec.yaml zstandard_windows/CHANGELOG.md
          if git diff --cached --quiet; then
            echo 'Release preparation is already committed.'
            exit 0
          fi
          git commit -m "gh-action: Prepare release $VERSION"
          git push origin "HEAD:$RELEASE_BRANCH"

  cli_build_macos_precompiled_libs:
    name: Build CLI libraries - macOS universal
    if: ${{ !inputs.resume }}
    runs-on: [self-hosted, macOS, ARM64]
    timeout-minutes: 60
    needs: [update_files]
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0
      - name: Update release branch
        env:
          RELEASE_BRANCH: ${{ github.ref_name }}
        run: git pull --ff-only origin "$RELEASE_BRANCH"
      - name: Build x86_64 and arm64 libraries
        run: |
          set -euo pipefail
          mkdir -p zstandard_cli/lib/src/bin
          rm -rf zstandard_cli/builders/macos_intel/build zstandard_cli/builders/macos_arm/build
          cmake -S zstandard_cli/builders/macos_intel -B zstandard_cli/builders/macos_intel/build \
            -DCMAKE_BUILD_TYPE=Release -DCMAKE_OSX_ARCHITECTURES=x86_64
          cmake --build zstandard_cli/builders/macos_intel/build --config Release --parallel
          mv zstandard_cli/builders/macos_intel/build/libzstandard_macos.dylib \
            zstandard_cli/lib/src/bin/libzstandard_macos_intel.dylib
          cmake -S zstandard_cli/builders/macos_arm -B zstandard_cli/builders/macos_arm/build \
            -DCMAKE_BUILD_TYPE=Release -DCMAKE_OSX_ARCHITECTURES=arm64
          cmake --build zstandard_cli/builders/macos_arm/build --config Release --parallel
          mv zstandard_cli/builders/macos_arm/build/libzstandard_macos.dylib \
            zstandard_cli/lib/src/bin/libzstandard_macos_arm.dylib
          lipo -create \
            zstandard_cli/lib/src/bin/libzstandard_macos_intel.dylib \
            zstandard_cli/lib/src/bin/libzstandard_macos_arm.dylib \
            -output zstandard_cli/lib/src/bin/libzstandard_macos.dylib
          rm zstandard_cli/lib/src/bin/libzstandard_macos_intel.dylib \
            zstandard_cli/lib/src/bin/libzstandard_macos_arm.dylib
          archs="$(lipo -archs zstandard_cli/lib/src/bin/libzstandard_macos.dylib)"
          [[ "$archs" == *x86_64* && "$archs" == *arm64* ]]
          echo "macOS architectures: $archs"
      - name: Commit and push macOS library
        env:
          RELEASE_BRANCH: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          git config user.name 'GitHub Actions'
          git config user.email 'actions@github.com'
          git add zstandard_cli/lib/src/bin/libzstandard_macos.dylib
          git commit -m 'gh-action: Add universal macOS CLI library'
          git push origin "HEAD:$RELEASE_BRANCH"

  cli_build_linux_precompiled_libs:
    name: Build CLI libraries - Linux
    if: ${{ !inputs.resume }}
    runs-on: [self-hosted, Linux]
    timeout-minutes: 60
    needs: [update_files, cli_build_macos_precompiled_libs]
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0
      - name: Update release branch
        env:
          RELEASE_BRANCH: ${{ github.ref_name }}
        run: git pull --ff-only origin "$RELEASE_BRANCH"
      - uses: ./.github/actions/setup-flutter
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
      - name: Build x86_64 and arm64 libraries
        run: |
          set -euo pipefail
          mkdir -p zstandard_cli/lib/src/bin
          rm -rf zstandard_cli/builders/linux_x64/build zstandard_cli/builders/linux_arm/build
          cmake -S zstandard_cli/builders/linux_x64 -B zstandard_cli/builders/linux_x64/build \
            -DCMAKE_BUILD_TYPE=Release
          cmake --build zstandard_cli/builders/linux_x64/build --config Release --parallel
          mv zstandard_cli/builders/linux_x64/build/libzstandard_linux.so \
            zstandard_cli/lib/src/bin/libzstandard_linux_x64.so
          cmake -S zstandard_cli/builders/linux_arm -B zstandard_cli/builders/linux_arm/build \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_TOOLCHAIN_FILE=zstandard_cli/builders/linux_arm/arm64-toolchain.cmake
          cmake --build zstandard_cli/builders/linux_arm/build --config Release --parallel
          mv zstandard_cli/builders/linux_arm/build/libzstandard_linux.so \
            zstandard_cli/lib/src/bin/libzstandard_linux_arm64.so
          x64_machine="$(readelf -h zstandard_cli/lib/src/bin/libzstandard_linux_x64.so | sed -n 's/^ *Machine: *//p')"
          arm_machine="$(readelf -h zstandard_cli/lib/src/bin/libzstandard_linux_arm64.so | sed -n 's/^ *Machine: *//p')"
          [[ "$x64_machine" == 'Advanced Micro Devices X86-64' ]]
          [[ "$arm_machine" == 'AArch64' ]]
          echo "Linux x86_64: $x64_machine"
          echo "Linux arm64: $arm_machine"
      - name: Commit and push Linux libraries
        env:
          RELEASE_BRANCH: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          git config user.name 'GitHub Actions'
          git config user.email 'actions@github.com'
          git add zstandard_cli/lib/src/bin/
          git commit -m 'gh-action: Add Linux CLI libraries'
          git push origin "HEAD:$RELEASE_BRANCH"

  cli_build_windows_precompiled_libs:
    name: Build CLI libraries - Windows
    if: ${{ !inputs.resume }}
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 60
    needs: [update_files, cli_build_linux_precompiled_libs]
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0
      - name: Update release branch
        shell: pwsh
        env:
          RELEASE_BRANCH: ${{ github.ref_name }}
        run: git pull --ff-only origin $env:RELEASE_BRANCH
      - uses: ./.github/actions/setup-preinstalled-flutter-windows
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
      - name: Build x64 and ARM64 libraries with the installed Visual Studio
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $generator = @((cmake --help | Select-String -AllMatches -Pattern 'Visual Studio \d+ \d{4}').Matches | ForEach-Object Value | Sort-Object -Unique | Sort-Object { [int](($_ -split ' ')[-1]) } -Descending | Select-Object -First 1)
          if (-not $generator) { throw 'No Visual Studio CMake generator was found.' }
          Write-Host "Using CMake generator: $generator"
          $root = (Get-Location).Path
          $x64Build = Join-Path $root 'zstandard_cli/builders/windows_x64/build'
          $armBuild = Join-Path $root 'zstandard_cli/builders/windows_arm/build'
          Remove-Item $x64Build,$armBuild -Recurse -Force -ErrorAction SilentlyContinue
          cmake -S zstandard_cli/builders/windows_x64 -B $x64Build -G $generator -A x64
          if ($LASTEXITCODE -ne 0) { throw 'Windows x64 CMake configuration failed.' }
          cmake --build $x64Build --config Release --parallel
          if ($LASTEXITCODE -ne 0) { throw 'Windows x64 build failed.' }
          cmake -S zstandard_cli/builders/windows_arm -B $armBuild -G $generator -A ARM64
          if ($LASTEXITCODE -ne 0) { throw 'Windows ARM64 CMake configuration failed.' }
          cmake --build $armBuild --config Release --parallel
          if ($LASTEXITCODE -ne 0) { throw 'Windows ARM64 build failed.' }
          New-Item -ItemType Directory -Force zstandard_cli/lib/src/bin | Out-Null
          Copy-Item (Join-Path $x64Build 'Release/zstandard_windows.dll') zstandard_cli/lib/src/bin/zstandard_windows_x64.dll
          Copy-Item (Join-Path $armBuild 'Release/zstandard_windows.dll') zstandard_cli/lib/src/bin/zstandard_windows_arm64.dll
          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio/Installer/vswhere.exe'
          $vsPath = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          $dumpbin = Get-ChildItem $vsPath -Filter dumpbin.exe -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $dumpbin) { throw 'dumpbin.exe was not found in the installed Visual Studio toolchain.' }
          $x64Headers = (& $dumpbin.FullName /headers zstandard_cli/lib/src/bin/zstandard_windows_x64.dll | Out-String)
          $armHeaders = (& $dumpbin.FullName /headers zstandard_cli/lib/src/bin/zstandard_windows_arm64.dll | Out-String)
          if ($x64Headers -notmatch '8664') { throw 'The Windows x64 DLL does not contain the AMD64 machine marker.' }
          if ($armHeaders -notmatch 'AA64') { throw 'The Windows ARM64 DLL does not contain the ARM64 machine marker.' }
          Write-Host 'Windows x64 and ARM64 DLL architectures verified.'
      - name: Commit and push Windows libraries
        shell: pwsh
        env:
          RELEASE_BRANCH: ${{ github.ref_name }}
        run: |
          $ErrorActionPreference = 'Stop'
          git config user.name 'GitHub Actions'
          git config user.email 'actions@github.com'
          git add zstandard_cli/lib/src/bin/
          git commit -m 'gh-action: Add Windows CLI libraries'
          git push origin "HEAD:$env:RELEASE_BRANCH"

  candidate_static_checks:
    name: Candidate static and package checks
    if: ${{ !inputs.resume }}
    runs-on: [self-hosted, Linux]
    timeout-minutes: 45
    needs: [update_files, cli_build_windows_precompiled_libs]
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0
      - name: Update release branch
        env:
          RELEASE_BRANCH: ${{ github.ref_name }}
        run: git pull --ff-only origin "$RELEASE_BRANCH"
      - uses: ./.github/actions/setup-flutter
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
      - name: Verify all release metadata and package tests
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          printf 'dependency_overrides:\n  zstandard_native:\n    path: ../zstandard_native\n' > zstandard_cli/pubspec_overrides.yaml
          printf 'dependency_overrides:\n  zstandard_android:\n    path: ../zstandard_android\n  zstandard_ios:\n    path: ../zstandard_ios\n  zstandard_linux:\n    path: ../zstandard_linux\n  zstandard_macos:\n    path: ../zstandard_macos\n  zstandard_native:\n    path: ../zstandard_native\n  zstandard_platform_interface:\n    path: ../zstandard_platform_interface\n  zstandard_web:\n    path: ../zstandard_web\n  zstandard_windows:\n    path: ../zstandard_windows\n' > zstandard/pubspec_overrides.yaml
          trap 'rm -f zstandard_cli/pubspec_overrides.yaml zstandard/pubspec_overrides.yaml' EXIT
          dart scripts/check_pub_metadata.dart --release-version "$VERSION"
          (cd zstandard_platform_interface && flutter pub get && flutter analyze && flutter test)
          (cd zstandard_native && dart pub get && dart analyze)
          (cd zstandard_cli && dart pub get && dart analyze && dart test)
          (cd zstandard && flutter pub get && flutter analyze && flutter test)
          git diff --check

  candidate_android:
    name: Candidate Android - AGP 9 and legacy
    if: ${{ !inputs.resume }}
    runs-on: [self-hosted, Linux]
    timeout-minutes: 120
    needs: [update_files, cli_build_windows_precompiled_libs]
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0
      - uses: ./.github/actions/setup-linux-dependencies
        with:
          android: 'true'
      - uses: ./.github/actions/setup-flutter
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
      - name: Build, run native tests and run both Android suites
        run: |
          set -euo pipefail
          for example in zstandard_android/example zstandard_android/example_legacy; do
            printf 'dependency_overrides:\n  zstandard_native:\n    path: ../../zstandard_native\n  zstandard_platform_interface:\n    path: ../../zstandard_platform_interface\n' > "$example/pubspec_overrides.yaml"
          done
          printf 'dependency_overrides:\n  zstandard_native:\n    path: ../zstandard_native\n  zstandard_platform_interface:\n    path: ../zstandard_platform_interface\n' > zstandard_android/pubspec_overrides.yaml
          trap 'rm -f zstandard_android/pubspec_overrides.yaml zstandard_android/example/pubspec_overrides.yaml zstandard_android/example_legacy/pubspec_overrides.yaml' EXIT
          (cd zstandard_android && flutter pub get && flutter analyze lib test && flutter test)
          bash scripts/check_android_ci_prerequisites.sh
          for example in example example_legacy; do
            if [[ "$example" == example ]]; then
              grep -F 'id "com.android.application" version "9.1.0" apply false' "zstandard_android/$example/android/settings.gradle"
              grep -F 'gradle-9.3.1-all.zip' "zstandard_android/$example/android/gradle/wrapper/gradle-wrapper.properties"
            else
              grep -F 'id "com.android.application" version "8.11.1" apply false' "zstandard_android/$example/android/settings.gradle"
              grep -F 'gradle-8.14-all.zip' "zstandard_android/$example/android/gradle/wrapper/gradle-wrapper.properties"
            fi
            (cd "zstandard_android/$example" && flutter pub get && flutter clean && flutter pub get && flutter build apk --debug --split-per-abi --target-platform android-arm,android-arm64,android-x64)
            bash scripts/check_android_apk_abis.sh "zstandard_android/$example/build/app/outputs/flutter-apk" debug
          done
          bash scripts/run_android_emulator_ci.sh bash -c '
            set -euo pipefail
            for example in example example_legacy; do
              cd "zstandard_android/$example"
              timeout --foreground 10m flutter test integration_test/android_compression_integration_test.dart -d "emulator-${EMULATOR_PORT}" --reporter expanded
              timeout --foreground 10m flutter test integration_test/android_properties_integration_test.dart -d "emulator-${EMULATOR_PORT}" --reporter expanded
              cd android
              timeout --foreground 15m bash ./gradlew --no-daemon connectedDebugAndroidTest --stacktrace
              cd ../..
            done
          '

  candidate_linux:
    name: Candidate Linux build and integration
    if: ${{ !inputs.resume }}
    runs-on: [self-hosted, Linux]
    timeout-minutes: 60
    needs: [update_files, cli_build_windows_precompiled_libs]
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0
      - uses: ./.github/actions/setup-linux-dependencies
        with:
          desktop: 'true'
      - uses: ./.github/actions/setup-flutter
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
      - name: Build, run native tests and run integration tests
        run: |
          set -euo pipefail
          printf 'dependency_overrides:\n  zstandard_native:\n    path: ../../zstandard_native\n  zstandard_platform_interface:\n    path: ../../zstandard_platform_interface\n' > zstandard_linux/example/pubspec_overrides.yaml
          printf 'dependency_overrides:\n  zstandard_native:\n    path: ../zstandard_native\n  zstandard_platform_interface:\n    path: ../zstandard_platform_interface\n' > zstandard_linux/pubspec_overrides.yaml
          trap 'rm -f zstandard_linux/pubspec_overrides.yaml zstandard_linux/example/pubspec_overrides.yaml' EXIT
          (cd zstandard_linux && flutter pub get && flutter analyze && flutter test)
          (cd zstandard_linux/example && flutter pub get)
          bash scripts/test_linux_integration.sh
          cmake_build_dir=$(find zstandard_linux/example/build/linux -type f -name CMakeCache.txt -not -path '*/_deps/*' -print | sed 's#/CMakeCache.txt$##' | sort | tail -n 1)
          test -n "$cmake_build_dir"
          (cd zstandard_linux/example && ZSTANDARD_LINUX_ENABLE_TESTS=1 cmake -S linux -B "$cmake_build_dir")
          cmake --build "$cmake_build_dir" --target zstandard_linux_test --parallel
          ctest --test-dir "$cmake_build_dir" --output-on-failure

  candidate_web:
    name: Candidate Web build and integration
    if: ${{ !inputs.resume }}
    runs-on: [self-hosted, Linux]
    timeout-minutes: 90
    needs: [update_files, cli_build_windows_precompiled_libs]
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0
      - uses: ./.github/actions/setup-linux-dependencies
        with:
          desktop: 'true'
      - uses: ./.github/actions/setup-flutter
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
      - uses: browser-actions/setup-chrome@v2
        id: chrome
        with:
          chrome-version: stable
          install-chromedriver: true
          install-dependencies: true
      - name: Build and run Web integration tests
        env:
          CHROME_EXECUTABLE: ${{ steps.chrome.outputs.chrome-path }}
        run: |
          set -euo pipefail
          printf 'dependency_overrides:\n  zstandard_native:\n    path: ../../zstandard_native\n  zstandard_platform_interface:\n    path: ../../zstandard_platform_interface\n' > zstandard_web/example/pubspec_overrides.yaml
          printf 'dependency_overrides:\n  zstandard_native:\n    path: ../zstandard_native\n  zstandard_platform_interface:\n    path: ../zstandard_platform_interface\n' > zstandard_web/pubspec_overrides.yaml
          trap 'rm -f zstandard_web/pubspec_overrides.yaml zstandard_web/example/pubspec_overrides.yaml' EXIT
          (cd zstandard_web && flutter pub get && flutter analyze)
          (cd zstandard_web/example && flutter pub get && flutter build web --release)
          bash scripts/test_web_integration.sh

  candidate_windows:
    name: Candidate Windows build and integration
    if: ${{ !inputs.resume }}
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 75
    needs: [update_files, cli_build_windows_precompiled_libs]
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0
      - uses: ./.github/actions/setup-preinstalled-flutter-windows
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
      - name: Build and run Windows tests
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          @"
          dependency_overrides:
            zstandard_native:
              path: ../../zstandard_native
            zstandard_platform_interface:
              path: ../../zstandard_platform_interface
          "@ | Set-Content zstandard_windows/example/pubspec_overrides.yaml
          @"
          dependency_overrides:
            zstandard_native:
              path: ../zstandard_native
            zstandard_platform_interface:
              path: ../zstandard_platform_interface
          "@ | Set-Content zstandard_windows/pubspec_overrides.yaml
          try {
            Push-Location zstandard_windows
            flutter pub get
            if ($LASTEXITCODE -ne 0) { throw 'Windows package pub get failed.' }
            flutter analyze
            if ($LASTEXITCODE -ne 0) { throw 'Windows package analysis failed.' }
            Pop-Location
            Push-Location zstandard_windows/example
            flutter pub get
            if ($LASTEXITCODE -ne 0) { throw 'Windows example pub get failed.' }
            flutter build windows --debug
            if ($LASTEXITCODE -ne 0) { throw 'Windows example build failed.' }
            $buildDir = (Resolve-Path 'build/windows/x64').Path
            cmake --build $buildDir --config Debug --target zstandard_windows_test --parallel
            if ($LASTEXITCODE -ne 0) { throw 'Windows native test build failed.' }
            $nativeTest = Join-Path $buildDir 'plugins/zstandard_windows/Debug/zstandard_windows_test.exe'
            if (-not (Test-Path $nativeTest)) { throw 'Windows native test executable was not produced.' }
            & $nativeTest
            if ($LASTEXITCODE -ne 0) { throw 'Windows native tests failed.' }
            $env:PATH = "$(Join-Path $buildDir 'runner/Debug');$env:PATH"
            Push-Location ..
            flutter test test
            if ($LASTEXITCODE -ne 0) { throw 'Windows package tests failed.' }
            Pop-Location
            flutter test integration_test/windows_integration_test.dart -d windows
            if ($LASTEXITCODE -ne 0) { throw 'Windows integration tests failed.' }
          } finally {
            Pop-Location
            Remove-Item zstandard_windows/pubspec_overrides.yaml -Force -ErrorAction SilentlyContinue
            Remove-Item zstandard_windows/example/pubspec_overrides.yaml -Force -ErrorAction SilentlyContinue
          }

  candidate_apple:
    name: Candidate Apple (${{ matrix.platform }}, ${{ matrix.dependency_manager }})
    if: ${{ !inputs.resume }}
    runs-on: [self-hosted, macOS, ARM64]
    timeout-minutes: 90
    needs: [update_files, cli_build_windows_precompiled_libs]
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        platform: [ios, macos]
        dependency_manager: [swiftpm, cocoapods]
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0
      - uses: ./.github/actions/preserve-flutter-project-files
        with:
          package: zstandard_${{ matrix.platform }}
          mode: save
      - uses: ./.github/actions/setup-preinstalled-flutter
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
      - name: Select dependency manager and local native source
        env:
          PLATFORM: ${{ matrix.platform }}
          DEPENDENCY_MANAGER: ${{ matrix.dependency_manager }}
        run: |
          set -euo pipefail
          printf 'dependency_overrides:\n  zstandard_native:\n    path: ../../zstandard_native\n  zstandard_platform_interface:\n    path: ../../zstandard_platform_interface\n' > "zstandard_${PLATFORM}/example/pubspec_overrides.yaml"
          printf 'dependency_overrides:\n  zstandard_native:\n    path: ../zstandard_native\n  zstandard_platform_interface:\n    path: ../zstandard_platform_interface\n' > "zstandard_${PLATFORM}/pubspec_overrides.yaml"
          if [[ "$DEPENDENCY_MANAGER" == swiftpm ]]; then
            flutter config --enable-swift-package-manager
            echo "ZSTANDARD_NATIVE_PACKAGE_PATH=$GITHUB_WORKSPACE" >> "$GITHUB_ENV"
          else
            flutter config --no-enable-swift-package-manager
          fi
      - name: Get dependencies and build Apple example
        env:
          PLATFORM: ${{ matrix.platform }}
          DEPENDENCY_MANAGER: ${{ matrix.dependency_manager }}
        run: |
          set -euo pipefail
          (cd "zstandard_${PLATFORM}" && flutter pub get && flutter analyze && flutter test)
          (cd "zstandard_${PLATFORM}/example" && flutter clean && flutter pub get)
          if [[ "$DEPENDENCY_MANAGER" == cocoapods ]]; then
            if [[ "$PLATFORM" == ios ]]; then
              (cd zstandard_ios/example/ios && pod install --verbose)
            else
              (cd zstandard_macos/example/macos && pod install --verbose)
            fi
          fi
          if [[ "$PLATFORM" == ios ]]; then
            (cd zstandard_ios/example && flutter build ios --simulator --debug --no-codesign)
          else
            (cd zstandard_macos/example && flutter build macos --debug)
          fi
      - name: Run Apple integration tests
        env:
          PLATFORM: ${{ matrix.platform }}
        run: |
          set -euo pipefail
          if [[ "$PLATFORM" == ios ]]; then
            chmod +x scripts/manage_ios_simulator.sh
            ./scripts/manage_ios_simulator.sh start
            trap './scripts/manage_ios_simulator.sh stop; rm -f zstandard_ios/example/pubspec_overrides.yaml' EXIT
            device_id=$(./scripts/manage_ios_simulator.sh device-id)
            (cd zstandard_ios/example && bash ../../scripts/run_with_timeout.sh 900 flutter test integration_test/ios_integration_test.dart -d "$device_id" --reporter expanded)
          else
            trap 'rm -f zstandard_macos/example/pubspec_overrides.yaml' EXIT
            (cd zstandard_macos/example && bash ../../scripts/run_with_timeout.sh 900 flutter test integration_test/macos_integration_test.dart -d macos --reporter expanded)
          fi
      - uses: ./.github/actions/preserve-flutter-project-files
        if: always()
        with:
          package: zstandard_${{ matrix.platform }}
          mode: restore
      - name: Remove candidate-only overrides
        if: always()
        run: |
          rm -f "zstandard_${{ matrix.platform }}/pubspec_overrides.yaml"
          rm -f "zstandard_${{ matrix.platform }}/example/pubspec_overrides.yaml"

  tag_version:
    name: Tag immutable candidate and create draft release
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs:
      - update_files
      - cli_build_macos_precompiled_libs
      - cli_build_linux_precompiled_libs
      - cli_build_windows_precompiled_libs
      - candidate_static_checks
      - candidate_android
      - candidate_linux
      - candidate_web
      - candidate_windows
      - candidate_apple
    if: >-
      ${{ always() && (inputs.resume ||
        (needs.update_files.result == 'success' &&
         needs.cli_build_macos_precompiled_libs.result == 'success' &&
         needs.cli_build_linux_precompiled_libs.result == 'success' &&
         needs.cli_build_windows_precompiled_libs.result == 'success' &&
         needs.candidate_static_checks.result == 'success' &&
         needs.candidate_android.result == 'success' &&
         needs.candidate_linux.result == 'success' &&
         needs.candidate_web.result == 'success' &&
         needs.candidate_windows.result == 'success' &&
         needs.candidate_apple.result == 'success')) }}
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0
      - name: Tag exact candidate and create draft release
        id: tag
        env:
          VERSION: ${{ inputs.version }}
          TITLE: ${{ inputs.title }}
          CHANGELOG_BODY: ${{ inputs.changelog }}
          RESUME: ${{ inputs.resume }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="v$VERSION"
          if [[ "$RESUME" == 'true' ]]; then
            git fetch origin "refs/tags/$tag:refs/tags/$tag"
            git checkout --detach "refs/tags/$tag"
          else
            git pull --ff-only origin "$GITHUB_REF_NAME"
            git tag -a "$tag" -m "Release $VERSION"
            git push origin "$tag"
          fi
          if ! gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            printf '%s\n' "$CHANGELOG_BODY" > release-notes.md
            gh release create "$tag" --repo "$GITHUB_REPOSITORY" --draft \
              --title "$TITLE" --notes-file release-notes.md
          fi
          {
            echo "Checksums for native CLI libraries at $tag"
            (cd zstandard_cli/lib/src/bin && sha256sum *)
          } > checksums-native-libs.txt
          gh release upload "$tag" checksums-native-libs.txt --repo "$GITHUB_REPOSITORY" --clobber
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

  platform_interface_publish_dry_run:
    name: Dry run - platform interface
    runs-on: [self-hosted, macOS, ARM64]
    timeout-minutes: 45
    needs: [tag_version]
    steps:
      - uses: actions/checkout@v6
        with:
          ref: refs/tags/v${{ inputs.version }}
          fetch-depth: 0
      - uses: ./.github/actions/setup-preinstalled-flutter
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
      - name: Get dependencies and dry run
        working-directory: zstandard_platform_interface
        run: flutter pub get && dart pub publish --dry-run

  platform_interface_publish:
    name: Publish - platform interface
    runs-on: [self-hosted, macOS, ARM64]
    timeout-minutes: 45
    needs: [platform_interface_publish_dry_run]
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          ref: refs/tags/v${{ inputs.version }}
          fetch-depth: 0
      - uses: ./.github/actions/setup-preinstalled-flutter
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
      - name: Publish package if required
        run: dart run scripts/publish_if_missing.dart zstandard_platform_interface "${{ inputs.version }}"
      - name: Upload package archive
        run: zip -r zstandard_platform_interface.zip zstandard_platform_interface
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ inputs.version }}
          files: zstandard_platform_interface.zip
        env:
          GITHUB_TOKEN: ${{ github.token }}

  zstandard_native_publish_dry_run:
    name: Dry run - native package
    runs-on: [self-hosted, macOS, ARM64]
    timeout-minutes: 45
    needs: [platform_interface_publish]
    steps:
      - uses: actions/checkout@v6
        with:
          ref: refs/tags/v${{ inputs.version }}
          fetch-depth: 0
      - uses: ./.github/actions/setup-preinstalled-flutter
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
      - name: Get dependencies and dry run
        working-directory: zstandard_native
        run: dart pub get && dart pub publish --dry-run

  zstandard_native_publish:
    name: Publish - native package
    runs-on: [self-hosted, macOS, ARM64]
    timeout-minutes: 45
    needs: [zstandard_native_publish_dry_run]
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          ref: refs/tags/v${{ inputs.version }}
          fetch-depth: 0
      - uses: ./.github/actions/setup-preinstalled-flutter
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
      - name: Publish package if required
        run: dart run scripts/publish_if_missing.dart zstandard_native "${{ inputs.version }}"
      - name: Wait for native package indexing
        run: dart run scripts/wait_for_pub_version.dart zstandard_native "${{ inputs.version }}" 1200
      - name: Upload package archive
        run: zip -r zstandard_native.zip zstandard_native
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ inputs.version }}
          files: zstandard_native.zip
        env:
          GITHUB_TOKEN: ${{ github.token }}

  platform_publish_dry_runs:
    name: Dry run - ${{ matrix.package }}
    runs-on: ${{ fromJSON(matrix.runs_on) }}
    timeout-minutes: 60
    needs: [zstandard_native_publish]
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        include:
          - package: zstandard_android
            runs_on: '["self-hosted", "Linux"]'
            setup: linux
          - package: zstandard_ios
            runs_on: '["self-hosted", "macOS", "ARM64"]'
            setup: apple
          - package: zstandard_macos
            runs_on: '["self-hosted", "macOS", "ARM64"]'
            setup: apple
          - package: zstandard_linux
            runs_on: '["self-hosted", "Linux"]'
            setup: linux
          - package: zstandard_web
            runs_on: '["self-hosted", "Linux"]'
            setup: linux
          - package: zstandard_windows
            runs_on: '["self-hosted", "Windows", "X64"]'
            setup: windows
    steps:
      - uses: actions/checkout@v6
        with:
          ref: refs/tags/v${{ inputs.version }}
          fetch-depth: 0
      - uses: ./.github/actions/setup-flutter
        if: matrix.setup == 'linux'
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
      - uses: ./.github/actions/setup-preinstalled-flutter
        if: matrix.setup == 'apple'
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
      - uses: ./.github/actions/setup-preinstalled-flutter-windows
        if: matrix.setup == 'windows'
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
      - name: Wait for native package indexing
        run: dart run scripts/wait_for_pub_version.dart zstandard_native "${{ inputs.version }}" 1200
      - name: Get dependencies and dry run
        working-directory: ${{ matrix.package }}
        if: matrix.setup != 'windows'
        run: flutter pub get && dart pub publish --dry-run
      - name: Get dependencies and dry run (Windows)
        working-directory: ${{ matrix.package }}
        if: matrix.setup == 'windows'
        shell: pwsh
        run: flutter pub get; if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }; dart pub publish --dry-run

  platform_publishes:
    name: Publish - ${{ matrix.package }}
    runs-on: ${{ fromJSON(matrix.runs_on) }}
    timeout-minutes: 60
    needs: [platform_publish_dry_runs]
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        include:
          - package: zstandard_android
            runs_on: '["self-hosted", "Linux"]'
            setup: linux
          - package: zstandard_ios
            runs_on: '["self-hosted", "macOS", "ARM64"]'
            setup: apple
          - package: zstandard_macos
            runs_on: '["self-hosted", "macOS", "ARM64"]'
            setup: apple
          - package: zstandard_linux
            runs_on: '["self-hosted", "Linux"]'
            setup: linux
          - package: zstandard_web
            runs_on: '["self-hosted", "Linux"]'
            setup: linux
          - package: zstandard_windows
            runs_on: '["self-hosted", "Windows", "X64"]'
            setup: windows
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          ref: refs/tags/v${{ inputs.version }}
          fetch-depth: 0
      - uses: ./.github/actions/setup-flutter
        if: matrix.setup == 'linux'
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
      - uses: ./.github/actions/setup-preinstalled-flutter
        if: matrix.setup == 'apple'
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
      - uses: ./.github/actions/setup-preinstalled-flutter-windows
        if: matrix.setup == 'windows'
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
      - name: Wait for native package indexing
        shell: bash
        run: dart run scripts/wait_for_pub_version.dart zstandard_native "${{ inputs.version }}" 1200
      - name: Publish package if required
        shell: bash
        run: dart run scripts/publish_if_missing.dart "${{ matrix.package }}" "${{ inputs.version }}"
      - name: Archive package
        if: matrix.setup != 'windows'
        run: zip -r "${{ matrix.package }}.zip" "${{ matrix.package }}"
      - name: Archive package (Windows)
        if: matrix.setup == 'windows'
        shell: pwsh
        run: Compress-Archive -Path "${{ matrix.package }}" -DestinationPath "${{ matrix.package }}.zip" -Force
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ inputs.version }}
          files: ${{ matrix.package }}.zip
        env:
          GITHUB_TOKEN: ${{ github.token }}

  cli_publish_dry_run:
    name: Dry run - CLI
    runs-on: [self-hosted, Linux]
    timeout-minutes: 60
    needs: [platform_publishes]
    steps:
      - uses: actions/checkout@v6
        with:
          ref: refs/tags/v${{ inputs.version }}
          fetch-depth: 0
      - uses: ./.github/actions/setup-flutter
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
      - name: Wait for platform package indexing
        run: |
          set -euo pipefail
          for package in zstandard_android zstandard_ios zstandard_linux zstandard_macos zstandard_web zstandard_windows; do
            dart run scripts/wait_for_pub_version.dart "$package" "${{ inputs.version }}" 1200
          done
      - name: Get dependencies and dry run
        working-directory: zstandard_cli
        run: dart pub get && dart pub publish --dry-run

  cli_publish:
    name: Publish - CLI
    runs-on: [self-hosted, Linux]
    timeout-minutes: 60
    needs: [cli_publish_dry_run]
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          ref: refs/tags/v${{ inputs.version }}
          fetch-depth: 0
      - uses: ./.github/actions/setup-flutter
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
      - name: Publish package if required
        run: dart run scripts/publish_if_missing.dart zstandard_cli "${{ inputs.version }}"
      - name: Upload package archive
        run: zip -r zstandard_cli.zip zstandard_cli
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ inputs.version }}
          files: zstandard_cli.zip
        env:
          GITHUB_TOKEN: ${{ github.token }}

  zstandard_publish_dry_run:
    name: Dry run - main plugin
    runs-on: [self-hosted, Linux]
    timeout-minutes: 60
    needs: [cli_publish]
    steps:
      - uses: actions/checkout@v6
        with:
          ref: refs/tags/v${{ inputs.version }}
          fetch-depth: 0
      - uses: ./.github/actions/setup-flutter
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
      - name: Wait for all published packages
        run: |
          set -euo pipefail
          for package in zstandard_platform_interface zstandard_native zstandard_android zstandard_ios zstandard_linux zstandard_macos zstandard_web zstandard_windows zstandard_cli; do
            dart run scripts/wait_for_pub_version.dart "$package" "${{ inputs.version }}" 1200
          done
      - name: Get dependencies and dry run
        working-directory: zstandard
        run: flutter pub get && dart pub publish --dry-run

  zstandard_publish:
    name: Publish - main plugin
    runs-on: [self-hosted, Linux]
    timeout-minutes: 60
    needs: [zstandard_publish_dry_run]
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          ref: refs/tags/v${{ inputs.version }}
          fetch-depth: 0
      - uses: ./.github/actions/setup-flutter
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
      - name: Publish package if required
        run: dart run scripts/publish_if_missing.dart zstandard "${{ inputs.version }}"
      - name: Upload package archive
        run: zip -r zstandard.zip zstandard
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ inputs.version }}
          files: zstandard.zip
        env:
          GITHUB_TOKEN: ${{ github.token }}

  verify_published_packages:
    name: Verify pub.dev - ${{ matrix.package }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [zstandard_publish]
    strategy:
      fail-fast: false
      matrix:
        package:
          - zstandard_platform_interface
          - zstandard_native
          - zstandard_android
          - zstandard_ios
          - zstandard_linux
          - zstandard_macos
          - zstandard_web
          - zstandard_windows
          - zstandard_cli
          - zstandard
    steps:
      - uses: actions/checkout@v6
        with:
          ref: refs/tags/v${{ inputs.version }}
      - name: Verify immutable package version
        run: dart run scripts/wait_for_pub_version.dart "${{ matrix.package }}" "${{ inputs.version }}" 1200

  finalize_release:
    name: Finalize GitHub release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [verify_published_packages]
    permissions:
      contents: write
    steps:
      - name: Mark draft release as final
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release edit "v${{ inputs.version }}" --repo "$GITHUB_REPOSITORY" --draft=false

  rollback_guide:
    name: Release recovery guide
    runs-on: ubuntu-latest
    if: >-
      ${{ always() && (contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')) }}
    needs:
      - update_files
      - cli_build_macos_precompiled_libs
      - cli_build_linux_precompiled_libs
      - cli_build_windows_precompiled_libs
      - candidate_static_checks
      - candidate_android
      - candidate_linux
      - candidate_web
      - candidate_windows
      - candidate_apple
      - tag_version
      - platform_interface_publish_dry_run
      - platform_interface_publish
      - zstandard_native_publish_dry_run
      - zstandard_native_publish
      - platform_publish_dry_runs
      - platform_publishes
      - cli_publish_dry_run
      - cli_publish
      - zstandard_publish_dry_run
      - zstandard_publish
      - verify_published_packages
      - finalize_release
    steps:
      - name: Write recovery instructions
        env:
          VERSION: ${{ inputs.version }}
        run: |
          {
            echo '## Release recovery'
            echo
            echo "The release workflow did not complete for **$VERSION**. Published pub.dev versions are immutable."
            echo
            echo '1. Inspect the first failed job and fix the runner, dependency, or credential problem.'
            echo '2. If the tag already exists, rerun this workflow with `resume: true`; already published packages are skipped safely.'
            echo '3. If the tag does not exist, rerun with `resume: false` after fixing the cause.'
            echo '4. Never force-move an existing release tag or republish a different archive under the same version.'
            echo
            echo 'Publication order: platform interface → native → platform packages → CLI → main plugin.'
          } >> "$GITHUB_STEP_SUMMARY"

  notify_deploy_completed:
    name: Notify deploy completed
    runs-on: ubuntu-latest
    needs: [finalize_release]
    steps:
      - name: Git Board Flow - deploy success notification
        continue-on-error: true
        uses: vypdev/copilot@v2
        with:
          debug: ${{ vars.DEBUG }}
          single-action: deployed_action
          single-action-issue: ${{ inputs.issue }}
          token: ${{ secrets.PAT }}
