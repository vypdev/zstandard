name: Task - Prepare Release

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'Internal orchestration phase'
        required: true
        default: prepare
        type: choice
        options: [prepare, publish, resume]
      operation-id:
        description: 'Internal durable operation identifier'
        required: false
        default: ''
      version:
        description: 'Release version (MAJOR.MINOR.PATCH)'
        required: false
        default: ''
      title:
        description: 'Release title'
        required: false
        default: ''
      changelog:
        description: 'Release changelog'
        required: false
        default: ''
      issue:
        description: 'Launcher issue'
        required: true

concurrency:
  group: copilot-deployment-${{ github.repository_id }}-${{ inputs.issue }}
  cancel-in-progress: false
  queue: max

defaults:
  run:
    shell: bash

permissions:
  contents: read

env:
  # This version is installed on Linux through setup-flutter and verified on
  # the persistent Apple Silicon/Windows runners by the local setup actions.
  FLUTTER_VERSION: '3.47.2'
  RELEASE_TREE: ${{ vars.RELEASE_TREE || 'release' }}
  EMSDK_REF: 'a36df02dc438e8b02f91122a4c62eeecb6784272'
  EMSCRIPTEN_VERSION: '3.1.69'

jobs:
  validate:
    name: Validate deployment command
    runs-on:
      group: vypdev
      labels:
        - self-hosted
        - codex
        - Linux
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Validate bounded orchestration inputs
        uses: actions/github-script@v9
        env:
          MODE: ${{ inputs.mode }}
          OPERATION_ID: ${{ inputs.operation-id }}
          VERSION: ${{ inputs.version }}
          ISSUE: ${{ inputs.issue }}
          TITLE: ${{ inputs.title }}
          CHANGELOG: ${{ inputs.changelog }}
          RELEASE_REF: ${{ github.ref }}
          RELEASE_TREE: ${{ vars.RELEASE_TREE || 'release' }}
        with:
          script: |
            const mode = process.env.MODE;
            const operationId = process.env.OPERATION_ID || '';
            const version = process.env.VERSION || '';
            const issueText = process.env.ISSUE || '';
            const issue = Number(issueText);
            const title = process.env.TITLE || '';
            const changelog = process.env.CHANGELOG || '';
            const errors = [];
            if (!/^[1-9][0-9]*$/.test(issueText) || !Number.isSafeInteger(issue) || issue < 1) errors.push('Issue must be a positive safe integer.');
            if (!/^[0-9]+\.[0-9]+\.[0-9]+$/.test(version)) errors.push('Version must use MAJOR.MINOR.PATCH.');
            if (mode === 'prepare') {
              if (process.env.RELEASE_REF !== `refs/heads/${process.env.RELEASE_TREE}/${version}`) errors.push('Preparation requires the matching release branch for this version.');
              if (operationId) errors.push('Operation ID must be empty in prepare mode.');
              if (!title || title.length > 1000) errors.push('Title must contain 1-1000 characters.');
              if (!changelog || changelog.length > 50000) errors.push('Changelog must contain 1-50000 characters.');
            } else if (mode === 'publish' || mode === 'resume') {
              if (!/^[A-Za-z0-9][A-Za-z0-9._-]{7,127}$/.test(operationId)) errors.push('Operation ID is invalid.');
              if (title || changelog) errors.push('Title and changelog must be empty in publish or resume mode.');
            } else errors.push('Mode must be prepare, publish, or resume.');
            if (errors.length) core.setFailed(errors.join(' '));

  update_files:
    name: Prepare release candidate
    if: inputs.mode == 'prepare'
    needs: validate
    runs-on:
      group: vypdev
      labels: [self-hosted, macOS, ARM64]
    timeout-minutes: 60
    outputs:
      commit: ${{ steps.candidate.outputs.commit }}
    permissions:
      contents: write
    steps:
      - uses: $/.github/actions/checkout-release-source
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0
          persist-credentials: true

      - name: Validate release branch, version and tag state
        id: context
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          git check-ref-format "refs/heads/$GITHUB_REF_NAME"
          if [[ "$GITHUB_REF_NAME" != "$RELEASE_TREE/$VERSION" ]]; then
            echo "Version $VERSION does not match branch $GITHUB_REF_NAME" >&2
            exit 1
          fi
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Version must be stable SemVer (x.y.z): $VERSION" >&2
            exit 1
          fi

          git fetch origin --tags --force
          tag="v$VERSION"
          if git ls-remote --exit-code --tags origin "refs/tags/$tag" >/dev/null 2>&1; then
            echo "Tag $tag already exists; release preparation is immutable." >&2
            exit 1
          fi

      - name: Prepare package versions and generated artifacts
        uses: ./.github/actions/prepare-package-release
        with:
          version: ${{ inputs.version }}
          title: ${{ inputs.title }}
          changelog: ${{ inputs.changelog }}
          flutter-version: ${{ env.FLUTTER_VERSION }}

      - id: candidate
        name: Commit and push release preparation
        env:
          VERSION: ${{ inputs.version }}
          RELEASE_BRANCH: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          git config user.name 'GitHub Actions'
          git config user.email 'actions@github.com'
          git add -- \
            CHANGELOG.md \
            zstandard/pubspec.yaml zstandard/CHANGELOG.md \
            zstandard_android/pubspec.yaml zstandard_android/CHANGELOG.md \
            zstandard_cli/pubspec.yaml zstandard_cli/CHANGELOG.md \
            zstandard_cli/lib/src/cli_runner.dart \
            zstandard_ios/pubspec.yaml zstandard_ios/CHANGELOG.md \
            zstandard_ios/ios/zstandard_ios/Package.swift \
            zstandard_ios/ios/zstandard_ios.podspec \
            zstandard_linux/pubspec.yaml zstandard_linux/CHANGELOG.md \
            zstandard_macos/pubspec.yaml zstandard_macos/CHANGELOG.md \
            zstandard_macos/macos/zstandard_macos/Package.swift \
            zstandard_macos/macos/zstandard_macos.podspec \
            zstandard_native/pubspec.yaml zstandard_native/CHANGELOG.md \
            zstandard_platform_interface/pubspec.yaml zstandard_platform_interface/CHANGELOG.md \
            zstandard_web/pubspec.yaml zstandard_web/CHANGELOG.md \
            zstandard_web/blob/zstd.js zstandard_web/blob/zstd.wasm \
            zstandard_web/blob/zstd_core.js zstandard_web/blob/zstd_worker.js \
            zstandard_web/example/web/zstd.js zstandard_web/example/web/zstd.wasm \
            zstandard_web/example/web/zstd_core.js zstandard_web/example/web/zstd_worker.js \
            zstandard/example/web/zstd.js zstandard/example/web/zstd.wasm \
            zstandard/example/web/zstd_core.js zstandard/example/web/zstd_worker.js \
            zstandard_windows/pubspec.yaml zstandard_windows/CHANGELOG.md
          if git diff --cached --quiet; then
            echo 'Release preparation is already committed.'
          else
            git commit -m "gh-action: Prepare release $VERSION"
          fi
          git push origin "HEAD:$RELEASE_BRANCH"
          echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  cli_build_macos_precompiled_libs:
    name: Build CLI libraries - macOS universal
    runs-on:
      group: vypdev
      labels: [self-hosted, macOS, ARM64]
    timeout-minutes: 60
    needs: [update_files]
    outputs:
      commit: ${{ steps.candidate.outputs.commit }}
    permissions:
      contents: write
    steps:
      - uses: $/.github/actions/checkout-release-source
        with:
          ref: ${{ needs.update_files.outputs.commit }}
          fetch-depth: 0
      - name: Build x86_64 and arm64 libraries
        run: |
          set -euo pipefail
          mkdir -p zstandard_cli/lib/src/bin
          rm -rf zstandard_cli/builders/macos_intel/build zstandard_cli/builders/macos_arm/build
          cmake -S zstandard_cli/builders/macos_intel -B zstandard_cli/builders/macos_intel/build \
            -DCMAKE_BUILD_TYPE=Release -DCMAKE_OSX_ARCHITECTURES=x86_64
          cmake --build zstandard_cli/builders/macos_intel/build --config Release --parallel
          mv zstandard_cli/builders/macos_intel/build/libzstandard_macos.dylib \
            zstandard_cli/lib/src/bin/libzstandard_macos_intel.dylib
          cmake -S zstandard_cli/builders/macos_arm -B zstandard_cli/builders/macos_arm/build \
            -DCMAKE_BUILD_TYPE=Release -DCMAKE_OSX_ARCHITECTURES=arm64
          cmake --build zstandard_cli/builders/macos_arm/build --config Release --parallel
          mv zstandard_cli/builders/macos_arm/build/libzstandard_macos.dylib \
            zstandard_cli/lib/src/bin/libzstandard_macos_arm.dylib
          lipo -create \
            zstandard_cli/lib/src/bin/libzstandard_macos_intel.dylib \
            zstandard_cli/lib/src/bin/libzstandard_macos_arm.dylib \
            -output zstandard_cli/lib/src/bin/libzstandard_macos.dylib
          rm zstandard_cli/lib/src/bin/libzstandard_macos_intel.dylib \
            zstandard_cli/lib/src/bin/libzstandard_macos_arm.dylib
          archs="$(lipo -archs zstandard_cli/lib/src/bin/libzstandard_macos.dylib)"
          [[ "$archs" == *x86_64* && "$archs" == *arm64* ]]
          echo "macOS architectures: $archs"
      - id: candidate
        name: Commit and push macOS library
        env:
          RELEASE_BRANCH: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          git config user.name 'GitHub Actions'
          git config user.email 'actions@github.com'
          git add zstandard_cli/lib/src/bin/libzstandard_macos.dylib
          if ! git diff --cached --quiet; then
            git commit -m 'gh-action: Add universal macOS CLI library'
          fi
          git push origin "HEAD:$RELEASE_BRANCH"
          echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  cli_build_linux_precompiled_libs:
    name: Build CLI libraries - Linux
    runs-on:
      group: vypdev
      labels: [self-hosted, codex, Linux]
    timeout-minutes: 60
    needs: [update_files, cli_build_macos_precompiled_libs]
    outputs:
      commit: ${{ steps.candidate.outputs.commit }}
    permissions:
      contents: write
    steps:
      - uses: $/.github/actions/checkout-release-source
        with:
          ref: ${{ needs.cli_build_macos_precompiled_libs.outputs.commit }}
          fetch-depth: 0
      - uses: ./.github/actions/setup-flutter
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
      - uses: ./.github/actions/setup-linux-dependencies
        with:
          arm64: 'true'
      - name: Build x86_64 and arm64 libraries
        run: |
          set -euo pipefail
          mkdir -p zstandard_cli/lib/src/bin
          rm -rf zstandard_cli/builders/linux_x64/build zstandard_cli/builders/linux_arm/build
          cmake -S zstandard_cli/builders/linux_x64 -B zstandard_cli/builders/linux_x64/build \
            -DCMAKE_BUILD_TYPE=Release
          cmake --build zstandard_cli/builders/linux_x64/build --config Release --parallel
          mv zstandard_cli/builders/linux_x64/build/libzstandard_linux.so \
            zstandard_cli/lib/src/bin/libzstandard_linux_x64.so
          (
            # Host development headers must not override the AArch64 sysroot.
            unset CPATH LIBRARY_PATH PKG_CONFIG_PATH PKG_CONFIG_SYSROOT_DIR CMAKE_PREFIX_PATH
            cmake -S zstandard_cli/builders/linux_arm -B zstandard_cli/builders/linux_arm/build \
              -DCMAKE_BUILD_TYPE=Release \
              -DCMAKE_TOOLCHAIN_FILE="$GITHUB_WORKSPACE/zstandard_cli/builders/linux_arm/arm64-toolchain.cmake"
            cmake --build zstandard_cli/builders/linux_arm/build --config Release --parallel
          )
          mv zstandard_cli/builders/linux_arm/build/libzstandard_linux.so \
            zstandard_cli/lib/src/bin/libzstandard_linux_arm64.so
          x64_machine="$(readelf -h zstandard_cli/lib/src/bin/libzstandard_linux_x64.so | sed -n 's/^ *Machine: *//p')"
          arm_machine="$(readelf -h zstandard_cli/lib/src/bin/libzstandard_linux_arm64.so | sed -n 's/^ *Machine: *//p')"
          [[ "$x64_machine" == 'Advanced Micro Devices X86-64' ]]
          [[ "$arm_machine" == 'AArch64' ]]
          echo "Linux x86_64: $x64_machine"
          echo "Linux arm64: $arm_machine"
      - id: candidate
        name: Commit and push Linux libraries
        env:
          RELEASE_BRANCH: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          git config user.name 'GitHub Actions'
          git config user.email 'actions@github.com'
          git add zstandard_cli/lib/src/bin/
          if ! git diff --cached --quiet; then
            git commit -m 'gh-action: Add Linux CLI libraries'
          fi
          git push origin "HEAD:$RELEASE_BRANCH"
          echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  cli_build_windows_precompiled_libs:
    name: Build CLI libraries - Windows
    # Both MSVC architectures are preinstalled on this standard image.
    runs-on: windows-2025
    timeout-minutes: 60
    needs: [update_files, cli_build_linux_precompiled_libs]
    outputs:
      commit: ${{ steps.candidate.outputs.commit }}
    permissions:
      contents: write
    steps:
      - uses: $/.github/actions/checkout-release-source
        with:
          ref: ${{ needs.cli_build_linux_precompiled_libs.outputs.commit }}
          fetch-depth: 0
      - name: Build x64 and ARM64 libraries with the installed Visual Studio
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio/Installer/vswhere.exe'
          $installations = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 Microsoft.VisualStudio.Component.VC.Tools.ARM64 -format json | ConvertFrom-Json
          $installation = $installations | Select-Object -First 1
          if (-not $installation) { throw 'Visual Studio with both x64 and ARM64 C++ tools is required.' }
          $vsPath = $installation.installationPath
          $vsMajor = ([Version]$installation.installationVersion).Major
          $generator = (cmake --help | Select-String -AllMatches -Pattern "Visual Studio $vsMajor \d{4}").Matches | ForEach-Object Value | Sort-Object -Unique | Select-Object -First 1
          if (-not $generator) { throw "CMake has no generator for the installed Visual Studio $vsMajor." }
          Write-Host "Using CMake generator: $generator"
          $root = (Get-Location).Path
          $x64Build = Join-Path $root 'zstandard_cli/builders/windows_x64/build'
          $armBuild = Join-Path $root 'zstandard_cli/builders/windows_arm/build'
          Remove-Item $x64Build,$armBuild -Recurse -Force -ErrorAction SilentlyContinue
          cmake -S zstandard_cli/builders/windows_x64 -B $x64Build -G $generator -A x64 "-DCMAKE_GENERATOR_INSTANCE=$vsPath"
          if ($LASTEXITCODE -ne 0) { throw 'Windows x64 CMake configuration failed.' }
          cmake --build $x64Build --config Release --parallel
          if ($LASTEXITCODE -ne 0) { throw 'Windows x64 build failed.' }
          cmake -S zstandard_cli/builders/windows_arm -B $armBuild -G $generator -A ARM64 "-DCMAKE_GENERATOR_INSTANCE=$vsPath"
          if ($LASTEXITCODE -ne 0) { throw 'Windows ARM64 CMake configuration failed.' }
          cmake --build $armBuild --config Release --parallel
          if ($LASTEXITCODE -ne 0) { throw 'Windows ARM64 build failed.' }
          New-Item -ItemType Directory -Force zstandard_cli/lib/src/bin | Out-Null
          Copy-Item (Join-Path $x64Build 'Release/zstandard_windows.dll') zstandard_cli/lib/src/bin/zstandard_windows_x64.dll
          Copy-Item (Join-Path $armBuild 'Release/zstandard_windows.dll') zstandard_cli/lib/src/bin/zstandard_windows_arm64.dll
          $dumpbin = Get-ChildItem $vsPath -Filter dumpbin.exe -Recurse -ErrorAction SilentlyContinue | Where-Object { $_.FullName -match '[\\/]bin[\\/]Hostx64[\\/]x64[\\/]dumpbin\.exe$' } | Select-Object -First 1
          if (-not $dumpbin) { throw 'dumpbin.exe was not found in the installed Visual Studio toolchain.' }
          $x64Headers = (& $dumpbin.FullName /headers zstandard_cli/lib/src/bin/zstandard_windows_x64.dll | Out-String)
          $armHeaders = (& $dumpbin.FullName /headers zstandard_cli/lib/src/bin/zstandard_windows_arm64.dll | Out-String)
          if ($x64Headers -notmatch '8664') { throw 'The Windows x64 DLL does not contain the AMD64 machine marker.' }
          if ($armHeaders -notmatch 'AA64') { throw 'The Windows ARM64 DLL does not contain the ARM64 machine marker.' }
          Write-Host 'Windows x64 and ARM64 DLL architectures verified.'
      - id: candidate
        name: Commit and push Windows libraries
        shell: powershell
        env:
          RELEASE_BRANCH: ${{ github.ref_name }}
        run: |
          $ErrorActionPreference = 'Stop'
          git config user.name 'GitHub Actions'
          git config user.email 'actions@github.com'
          git add zstandard_cli/lib/src/bin/
          if ($LASTEXITCODE -ne 0) { throw 'Staging Windows libraries failed.' }
          git diff --cached --quiet
          if ($LASTEXITCODE -eq 1) {
            git commit -m 'gh-action: Add Windows CLI libraries'
            if ($LASTEXITCODE -ne 0) { throw 'Committing Windows libraries failed.' }
          } elseif ($LASTEXITCODE -ne 0) { throw 'Inspecting Windows library changes failed.' }
          git push origin "HEAD:$env:RELEASE_BRANCH"
          if ($LASTEXITCODE -ne 0) { throw 'Pushing Windows libraries failed.' }
          $candidateCommit = git rev-parse HEAD
          if ($LASTEXITCODE -ne 0) { throw 'Reading Windows candidate commit failed.' }
          "commit=$candidateCommit" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

  candidate_static_checks:
    name: Candidate static and package checks
    runs-on:
      group: vypdev
      labels: [self-hosted, codex, Linux]
    timeout-minutes: 45
    needs: [update_files, cli_build_windows_precompiled_libs]
    steps:
      - uses: $/.github/actions/checkout-release-source
        with:
          ref: ${{ needs.cli_build_windows_precompiled_libs.outputs.commit }}
          fetch-depth: 0
      - uses: ./.github/actions/setup-flutter
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
      - uses: ./.github/actions/prepare-candidate-dependencies
      - name: Test Web integration launcher
        run: python3 -m unittest discover -s scripts/tests -p test_web_integration_runner.py -v
      - name: Verify all release metadata and package tests
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          dart scripts/check_pub_metadata.dart --release-version "$VERSION"
          for package in zstandard_platform_interface zstandard_native zstandard_android zstandard_ios zstandard_linux zstandard_macos zstandard_web zstandard_windows zstandard_cli zstandard; do
            (
              cd "$package"
              case "$package" in
                zstandard_native|zstandard_cli) dart pub get ;;
                *) flutter pub get ;;
              esac
              dart format --output=none --set-exit-if-changed .
            )
          done
          (cd zstandard_platform_interface && flutter analyze && flutter test)
          (cd zstandard_native && dart analyze)
          (cd zstandard_cli && dart analyze && dart test)
          (cd zstandard && flutter analyze && flutter test)
          git diff --check

  candidate_android:
    name: Candidate Android - AGP 9 and legacy
    runs-on:
      group: vypdev
      labels: [self-hosted, codex, Linux]
    timeout-minutes: 120
    needs: [update_files, cli_build_windows_precompiled_libs]
    steps:
      - uses: $/.github/actions/checkout-release-source
        with:
          ref: ${{ needs.cli_build_windows_precompiled_libs.outputs.commit }}
          fetch-depth: 0
      - uses: ./.github/actions/setup-linux-dependencies
        with:
          android: 'true'
      - uses: ./.github/actions/setup-flutter
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
      - uses: ./.github/actions/prepare-android-gradle
      - name: Build, run native tests and run both Android suites
        run: |
          set -euo pipefail
          for example in zstandard_android/example zstandard_android/example_legacy; do
            printf 'dependency_overrides:\n  zstandard_native:\n    path: ../../zstandard_native\n  zstandard_platform_interface:\n    path: ../../zstandard_platform_interface\n' > "$example/pubspec_overrides.yaml"
          done
          printf 'dependency_overrides:\n  zstandard_native:\n    path: ../zstandard_native\n  zstandard_platform_interface:\n    path: ../zstandard_platform_interface\n' > zstandard_android/pubspec_overrides.yaml
          trap 'rm -f zstandard_android/pubspec_overrides.yaml zstandard_android/example/pubspec_overrides.yaml zstandard_android/example_legacy/pubspec_overrides.yaml' EXIT
          (cd zstandard_android && flutter pub get && flutter analyze lib test && flutter test)
          bash scripts/check_android_ci_prerequisites.sh
          for example in example example_legacy; do
            # Keep modern and legacy Gradle state separate within this job too.
            mkdir -p "$GRADLE_USER_HOME/$example"
            cp "$GRADLE_USER_HOME/gradle.properties" "$GRADLE_USER_HOME/$example/gradle.properties"
            if [[ "$example" == example ]]; then
              grep -F 'id "com.android.application" version "9.1.0" apply false' "zstandard_android/$example/android/settings.gradle"
              grep -F 'gradle-9.3.1-all.zip' "zstandard_android/$example/android/gradle/wrapper/gradle-wrapper.properties"
            else
              grep -F 'id "com.android.application" version "8.11.1" apply false' "zstandard_android/$example/android/settings.gradle"
              grep -F 'gradle-8.14-all.zip' "zstandard_android/$example/android/gradle/wrapper/gradle-wrapper.properties"
            fi
            (export GRADLE_USER_HOME="$GRADLE_USER_HOME/$example"; cd "zstandard_android/$example" && flutter pub get && flutter clean && flutter pub get && flutter build apk --release --split-per-abi --target-platform android-arm,android-arm64,android-x64)
            bash scripts/check_android_apk_abis.sh "zstandard_android/$example/build/app/outputs/flutter-apk" release
          done
          bash scripts/run_android_emulator_ci.sh bash -c '
            set -euo pipefail
            for example in example example_legacy; do
              (
                export GRADLE_USER_HOME="$GRADLE_USER_HOME/$example"
                cd "zstandard_android/$example"
                timeout --foreground 10m flutter test integration_test/android_compression_integration_test.dart -d "emulator-${EMULATOR_PORT}" --reporter expanded
                timeout --foreground 10m flutter test integration_test/android_properties_integration_test.dart -d "emulator-${EMULATOR_PORT}" --reporter expanded
                cd android
                timeout --foreground 15m bash ./gradlew --no-daemon connectedDebugAndroidTest --stacktrace
              )
            done
          '

  candidate_linux:
    name: Candidate Linux build and integration
    runs-on:
      group: vypdev
      labels: [self-hosted, codex, Linux]
    timeout-minutes: 60
    needs: [update_files, cli_build_windows_precompiled_libs]
    steps:
      - uses: $/.github/actions/checkout-release-source
        with:
          ref: ${{ needs.cli_build_windows_precompiled_libs.outputs.commit }}
          fetch-depth: 0
      - uses: ./.github/actions/setup-linux-dependencies
        with:
          desktop: 'true'
      - uses: ./.github/actions/setup-flutter
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
      - name: Build, run native tests and run integration tests
        run: |
          set -euo pipefail
          printf 'dependency_overrides:\n  zstandard_native:\n    path: ../../zstandard_native\n  zstandard_platform_interface:\n    path: ../../zstandard_platform_interface\n' > zstandard_linux/example/pubspec_overrides.yaml
          printf 'dependency_overrides:\n  zstandard_native:\n    path: ../zstandard_native\n  zstandard_platform_interface:\n    path: ../zstandard_platform_interface\n' > zstandard_linux/pubspec_overrides.yaml
          trap 'rm -f zstandard_linux/pubspec_overrides.yaml zstandard_linux/example/pubspec_overrides.yaml' EXIT
          (cd zstandard_linux && flutter pub get && flutter analyze)
          (cd zstandard_linux/example && flutter pub get)
          (cd zstandard_linux/example && flutter build linux --release)
          plugin_library=$(find zstandard_linux/example/build/linux -type f -path '*/release/bundle/lib/libzstandard_linux_plugin.so' -print -quit)
          test -n "$plugin_library"
          plugin_directory="$(cd "$(dirname "$plugin_library")" && pwd)"
          (cd zstandard_linux && LD_LIBRARY_PATH="$plugin_directory${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}" flutter test)
          cmake_build_dir=$(find zstandard_linux/example/build/linux -type f -name CMakeCache.txt -not -path '*/_deps/*' -print | sed 's#/CMakeCache.txt$##' | sort | tail -n 1)
          test -n "$cmake_build_dir"
          cmake_build_dir="$(cd "$cmake_build_dir" && pwd)"
          (cd zstandard_linux/example && ZSTANDARD_LINUX_ENABLE_TESTS=1 cmake -S linux -B "$cmake_build_dir")
          cmake --build "$cmake_build_dir" --target zstandard_linux_test --parallel
          ctest --test-dir "$cmake_build_dir" --output-on-failure --no-tests=error
          # Flutter integration leaves generated_config.cmake pointing at a
          # temporary test listener; finish native builds before it is retired.
          bash scripts/test_linux_integration.sh

  candidate_web:
    name: Candidate Web build and integration
    runs-on:
      group: vypdev
      labels: [self-hosted, codex, Linux]
    timeout-minutes: 90
    needs: [update_files, cli_build_windows_precompiled_libs]
    steps:
      - uses: $/.github/actions/checkout-release-source
        with:
          ref: ${{ needs.cli_build_windows_precompiled_libs.outputs.commit }}
          fetch-depth: 0
      - uses: ./.github/actions/setup-linux-dependencies
        with:
          desktop: 'true'
          browser: 'true'
      - uses: ./.github/actions/setup-flutter
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
      - uses: browser-actions/setup-chrome@v2
        id: chrome
        with:
          chrome-version: stable
          install-chromedriver: true
          install-dependencies: false
          no-sudo: true
      - name: Build and run Web integration tests
        env:
          CHROME_EXECUTABLE: ${{ steps.chrome.outputs.chrome-path }}
        run: |
          set -euo pipefail
          printf 'dependency_overrides:\n  zstandard_native:\n    path: ../../zstandard_native\n  zstandard_platform_interface:\n    path: ../../zstandard_platform_interface\n' > zstandard_web/example/pubspec_overrides.yaml
          printf 'dependency_overrides:\n  zstandard_native:\n    path: ../zstandard_native\n  zstandard_platform_interface:\n    path: ../zstandard_platform_interface\n' > zstandard_web/pubspec_overrides.yaml
          trap 'rm -f zstandard_web/pubspec_overrides.yaml zstandard_web/example/pubspec_overrides.yaml' EXIT
          (cd zstandard_web && flutter pub get && flutter analyze && flutter test)
          (cd zstandard_web/example && flutter pub get && flutter build web --release)
          bash scripts/test_web_integration.sh

  candidate_windows:
    name: Candidate Windows build and integration
    runs-on:
      group: vypdev
      labels: [self-hosted, Windows, X64]
    timeout-minutes: 75
    needs: [update_files, cli_build_windows_precompiled_libs]
    steps:
      - uses: $/.github/actions/checkout-release-source
        with:
          ref: ${{ needs.cli_build_windows_precompiled_libs.outputs.commit }}
          fetch-depth: 0
      - uses: ./.github/actions/setup-flutter-windows
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
      - name: Build and run Windows tests
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          @"
          dependency_overrides:
            zstandard_native:
              path: ../../zstandard_native
            zstandard_platform_interface:
              path: ../../zstandard_platform_interface
          "@ | Set-Content zstandard_windows/example/pubspec_overrides.yaml
          @"
          dependency_overrides:
            zstandard_native:
              path: ../zstandard_native
            zstandard_platform_interface:
              path: ../zstandard_platform_interface
          "@ | Set-Content zstandard_windows/pubspec_overrides.yaml
          try {
            Push-Location zstandard_windows
            flutter pub get
            if ($LASTEXITCODE -ne 0) { throw 'Windows package pub get failed.' }
            flutter analyze
            if ($LASTEXITCODE -ne 0) { throw 'Windows package analysis failed.' }
            Pop-Location
            Push-Location zstandard_windows/example
            flutter pub get
            if ($LASTEXITCODE -ne 0) { throw 'Windows example pub get failed.' }
            flutter build windows --release
            if ($LASTEXITCODE -ne 0) { throw 'Windows release build failed.' }
            flutter build windows --debug
            if ($LASTEXITCODE -ne 0) { throw 'Windows example build failed.' }
            $buildDir = (Resolve-Path 'build/windows/x64').Path
            cmake --build $buildDir --config Debug --target zstandard_windows_test --parallel
            if ($LASTEXITCODE -ne 0) { throw 'Windows native test build failed.' }
            $nativeTest = Join-Path $buildDir 'plugins/zstandard_windows/Debug/zstandard_windows_test.exe'
            if (-not (Test-Path $nativeTest)) { throw 'Windows native test executable was not produced.' }
            & $nativeTest
            if ($LASTEXITCODE -ne 0) { throw 'Windows native tests failed.' }
            $env:PATH = "$(Join-Path $buildDir 'runner/Debug');$env:PATH"
            Push-Location ..
            flutter test test
            if ($LASTEXITCODE -ne 0) { throw 'Windows package tests failed.' }
            Pop-Location
            flutter test integration_test/windows_integration_test.dart -d windows
            if ($LASTEXITCODE -ne 0) { throw 'Windows integration tests failed.' }
          } finally {
            Pop-Location
            Remove-Item zstandard_windows/pubspec_overrides.yaml -Force -ErrorAction SilentlyContinue
            Remove-Item zstandard_windows/example/pubspec_overrides.yaml -Force -ErrorAction SilentlyContinue
          }

  candidate_apple:
    name: Candidate Apple (${{ matrix.platform }}, ${{ matrix.dependency_manager }})
    runs-on:
      group: vypdev
      labels: [self-hosted, macOS, ARM64]
    timeout-minutes: 90
    concurrency:
      group: zstandard-apple-flutter-toolchain
      cancel-in-progress: false
    needs: [update_files, cli_build_windows_precompiled_libs]
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        platform: [ios, macos]
        dependency_manager: [swiftpm, cocoapods]
    steps:
      - uses: $/.github/actions/checkout-release-source
        with:
          ref: ${{ needs.cli_build_windows_precompiled_libs.outputs.commit }}
          fetch-depth: 0
      - uses: ./.github/actions/preserve-flutter-project-files
        with:
          package: zstandard_${{ matrix.platform }}
          mode: save
      - uses: ./.github/actions/setup-flutter
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
      - name: Prepare private Flutter SDK with upstream iOS startup fix
        if: matrix.platform == 'ios'
        timeout-minutes: 10
        run: bash .github/scripts/prepare_ios_flutter.sh
      - name: Select dependency manager and local native source
        env:
          PLATFORM: ${{ matrix.platform }}
          DEPENDENCY_MANAGER: ${{ matrix.dependency_manager }}
        run: |
          set -euo pipefail
          printf 'dependency_overrides:\n  zstandard_native:\n    path: ../../zstandard_native\n  zstandard_platform_interface:\n    path: ../../zstandard_platform_interface\n' > "zstandard_${PLATFORM}/example/pubspec_overrides.yaml"
          printf 'dependency_overrides:\n  zstandard_native:\n    path: ../zstandard_native\n  zstandard_platform_interface:\n    path: ../zstandard_platform_interface\n' > "zstandard_${PLATFORM}/pubspec_overrides.yaml"
          if [[ "$DEPENDENCY_MANAGER" == swiftpm ]]; then
            flutter config --enable-swift-package-manager
            echo "ZSTANDARD_NATIVE_PACKAGE_PATH=$GITHUB_WORKSPACE" >> "$GITHUB_ENV"
          else
            flutter config --no-enable-swift-package-manager
          fi
      - name: Get dependencies and build Apple example
        env:
          PLATFORM: ${{ matrix.platform }}
          DEPENDENCY_MANAGER: ${{ matrix.dependency_manager }}
        run: |
          set -euo pipefail
          (cd "zstandard_${PLATFORM}" && flutter pub get && flutter analyze && flutter test)
          (cd "zstandard_${PLATFORM}/example" && flutter clean && flutter pub get)
          if [[ "$DEPENDENCY_MANAGER" == cocoapods ]]; then
            if [[ "$PLATFORM" == ios ]]; then
              (cd zstandard_ios/example/ios && pod install --verbose)
            else
              (cd zstandard_macos/example/macos && pod install --verbose)
            fi
          fi
          if [[ "$PLATFORM" == ios ]]; then
            # Flutter does not support Release mode for the iOS simulator.
            # Compile an unsigned device Release artifact, then let the next
            # step build and execute the behavioral suite on the simulator.
            (cd zstandard_ios/example && flutter build ios --release --no-codesign)
            (cd zstandard_ios/example && flutter build ios --simulator --debug --no-codesign)
          else
            (cd zstandard_macos/example && flutter build macos --release)
          fi
      - name: Run Apple integration tests
        env:
          PLATFORM: ${{ matrix.platform }}
        run: |
          set -euo pipefail
          if [[ "$PLATFORM" == ios ]]; then
            simulator_output="$(mktemp "$RUNNER_TEMP/zstandard-release-simulator.XXXXXX")"
            cleanup_simulator() {
              device_id="$(sed -n 's/^device-id=//p' "$simulator_output")"
              if [[ "$device_id" =~ ^[A-F0-9]{8}-[A-F0-9]{4}-[A-F0-9]{4}-[A-F0-9]{4}-[A-F0-9]{12}$ ]]; then
                xcrun simctl shutdown "$device_id" 2>/dev/null || true
                xcrun simctl delete "$device_id"
              fi
              rm -f "$simulator_output" zstandard_ios/example/pubspec_overrides.yaml
            }
            trap cleanup_simulator EXIT
            GITHUB_OUTPUT="$simulator_output" python3 .github/scripts/start_ios_simulator.py
            device_id="$(sed -n 's/^device-id=//p' "$simulator_output")"
            (cd zstandard_ios/example && bash ../../scripts/run_with_timeout.sh 900 flutter test integration_test/ios_integration_test.dart -d "$device_id" --reporter expanded --verbose)
          else
            trap 'rm -f zstandard_macos/example/pubspec_overrides.yaml' EXIT
            (cd zstandard_macos/example && bash ../../scripts/run_with_timeout.sh 900 flutter test integration_test/macos_integration_test.dart -d macos --reporter expanded)
          fi
      - uses: ./.github/actions/preserve-flutter-project-files
        if: always()
        with:
          package: zstandard_${{ matrix.platform }}
          mode: restore
      - name: Remove candidate-only overrides
        if: always()
        run: |
          rm -f "zstandard_${{ matrix.platform }}/pubspec_overrides.yaml"
          rm -f "zstandard_${{ matrix.platform }}/example/pubspec_overrides.yaml"
      - name: Restore Flutter dependency-manager default
        if: always()
        run: flutter config --no-enable-swift-package-manager
      - name: Remove this job's patched Flutter SDK
        if: ${{ always() && env.ZSTANDARD_IOS_FLUTTER_DIR != '' }}
        timeout-minutes: 3
        run: bash .github/scripts/prepare_ios_flutter.sh --cleanup

  ready_to_tag:
    name: Release candidate ready to tag
    runs-on:
      group: vypdev
      labels: [self-hosted, codex, Linux]
    timeout-minutes: 10
    needs:
      - update_files
      - cli_build_macos_precompiled_libs
      - cli_build_linux_precompiled_libs
      - cli_build_windows_precompiled_libs
      - candidate_static_checks
      - candidate_android
      - candidate_linux
      - candidate_web
      - candidate_windows
      - candidate_apple
    steps:
      - uses: $/.github/actions/checkout-release-source
        with:
          ref: ${{ needs.cli_build_windows_precompiled_libs.outputs.commit }}
          fetch-depth: 0

      - uses: ./.github/actions/setup-flutter
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}

      - name: Verify exact candidate at the remote branch tip
        env:
          VERSION: ${{ inputs.version }}
          RELEASE_BRANCH: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          git fetch origin "$RELEASE_BRANCH" --tags
          remote_sha="$(git rev-parse "origin/$RELEASE_BRANCH")"
          test "$remote_sha" = "$(git rev-parse HEAD)"
          dart scripts/check_pub_metadata.dart --release-version "$VERSION"
          test -s zstandard_cli/lib/src/bin/libzstandard_macos.dylib
          test -s zstandard_cli/lib/src/bin/libzstandard_linux_x64.so
          test -s zstandard_cli/lib/src/bin/libzstandard_linux_arm64.so
          test -s zstandard_cli/lib/src/bin/zstandard_windows_x64.dll
          test -s zstandard_cli/lib/src/bin/zstandard_windows_arm64.dll
          {
            echo '## Release candidate validated'
            echo
            echo "Candidate: \`$remote_sha\`"
            echo
            echo 'Copilot will open the production promotion PR. Publication requires its accepted merge and environment approval.'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Record exact candidate evidence
        env:
          VERSION: ${{ inputs.version }}
          ISSUE: ${{ inputs.issue }}
        run: python3 scripts/release_candidate.py record "$VERSION" "$ISSUE" "$RUNNER_TEMP/release-candidate.json"
      - uses: actions/upload-artifact@v5
        with:
          name: release-candidate-${{ inputs.version }}
          path: ${{ runner.temp }}/release-candidate.json
          if-no-files-found: error
          overwrite: true
          retention-days: 90

  promote:
    name: Open production promotion
    if: ${{ inputs.mode == 'prepare' }}
    runs-on:
      group: vypdev
      labels:
        - self-hosted
        - codex
        - Linux
    needs: ready_to_tag
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
      pull-requests: write
      actions: write
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Create or resume promotion PR
        uses: vypdev/copilot@v3
        with:
          single-action: prepare_deployment_action
          single-action-issue: ${{ inputs.issue }}
          issue-workflow-profile: ${{ vars.COPILOT_ISSUE_WORKFLOW_PROFILE || '' }}
          single-action-version: ${{ inputs.version }}
          single-action-title: ${{ inputs.title }}
          single-action-changelog: ${{ inputs.changelog }}
          main-branch: ${{ vars.MAIN_BRANCH || 'master' }}
          development-branch: ${{ vars.DEVELOPMENT_BRANCH || 'develop' }}
          release-tree: ${{ vars.RELEASE_TREE || 'release' }}
          hotfix-tree: ${{ vars.HOTFIX_TREE || 'hotfix' }}
          release-workflow: ${{ vars.RELEASE_WORKFLOW || 'release_workflow.yml' }}
          hotfix-workflow: ${{ vars.HOTFIX_WORKFLOW || 'hotfix_workflow.yml' }}
          release-reconciliation-strategy: ${{ vars.RELEASE_RECONCILIATION_STRATEGY || 'production-lineage' }}
          hotfix-reconciliation-strategy: ${{ vars.HOTFIX_RECONCILIATION_STRATEGY || 'production-lineage' }}
          reconciliation-pr-mode: ${{ vars.RECONCILIATION_PR_MODE || 'auto' }}
          merge-queue-check-attestations: ${{ vars.MERGE_QUEUE_CHECK_ATTESTATIONS || '[]' }}
          reconciliation-backmerge-mode: ${{ vars.RECONCILIATION_BACKMERGE_MODE || 'auto' }}
          hotfix-active-release-policy: ${{ vars.HOTFIX_ACTIVE_RELEASE_POLICY || 'prefer-release' }}
          reconciliation-tree: ${{ vars.RECONCILIATION_TREE || 'sync' }}
          reconciliation-cleanup: ${{ vars.RECONCILIATION_CLEANUP || 'all' }}
          reconciliation-issue-completion: ${{ vars.RECONCILIATION_ISSUE_COMPLETION || 'close' }}
          orchestration-presentation-mode: ${{ vars.ORCHESTRATION_PRESENTATION_MODE || 'guided' }}
          orchestration-diagrams: ${{ vars.ORCHESTRATION_DIAGRAMS || 'true' }}
          orchestration-comment-mode: ${{ vars.ORCHESTRATION_COMMENT_MODE || 'update' }}
          repository-locale: ${{ vars.REPOSITORY_LOCALE || 'en-US' }}
          issues-locale: ${{ vars.ISSUES_LOCALE || '' }}
          pull-requests-locale: ${{ vars.PULL_REQUESTS_LOCALE || '' }}
          token: ${{ secrets.PAT }}


  publish:
    name: Publish accepted production commit
    if: ${{ inputs.mode == 'publish' }}
    runs-on:
      group: vypdev
      labels: [self-hosted, codex, Linux]
    needs: validate
    timeout-minutes: 30
    permissions:
      contents: write
      issues: write
      pull-requests: write
      actions: write
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
          ref: ${{ vars.MAIN_BRANCH || 'master' }}
      - name: Create or verify production tag
        uses: vypdev/copilot@v3
        with:
          single-action: create_tag
          single-action-issue: ${{ inputs.issue }}
          issue-workflow-profile: ${{ vars.COPILOT_ISSUE_WORKFLOW_PROFILE || '' }}
          single-action-operation-id: ${{ inputs.operation-id }}
          single-action-version: ${{ inputs.version }}
          token: ${{ secrets.PAT }}
      - name: Retry a failed publication of the same immutable tag
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          tag="v$VERSION"
          sha="$(gh api "repos/$GITHUB_REPOSITORY/commits/$tag" --jq '.sha')"
          run="$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/publish_workflow.yml/runs?head_sha=$sha&per_page=100" \
            | jq -r --arg tag "$tag" '.workflow_runs | map(select(.head_branch == $tag and .event == "push")) | sort_by(.id) | last | if . == null then "" else "\(.id) \(.status) \(.conclusion)" end')"
          if [[ -n "$run" ]]; then
            read -r run_id status conclusion <<< "$run"
            if [[ "$status" == completed && "$conclusion" =~ ^(failure|cancelled|timed_out)$ ]]; then
              gh api --method POST "repos/$GITHUB_REPOSITORY/actions/runs/$run_id/rerun"
            fi
          fi
      - name: Await tag-triggered package publication
        run: echo 'The immutable tag starts Publish Tagged Release. Its verified completion notifies Copilot and starts reconciliation.'

  resume-reconciliation:
    name: Resume published deployment
    if: ${{ inputs.mode == 'resume' }}
    runs-on:
      group: vypdev
      labels:
        - self-hosted
        - codex
        - Linux
    needs: validate
    timeout-minutes: 15
    permissions:
      issues: write
      pull-requests: write
    steps:
      - name: Verify published operation before recovery
        uses: actions/github-script@v9
        env:
          ISSUE: ${{ inputs.issue }}
          OPERATION_ID: ${{ inputs.operation-id }}
          VERSION: ${{ inputs.version }}
        with:
          script: |
            const response = await github.rest.issues.get({ ...context.repo, issue_number: Number(process.env.ISSUE) });
            if (response.data.pull_request) throw new Error('The launcher must be an issue.');
            const body = response.data.body || '';
            const start = '<!-- copilot-configuration-start';
            const end = 'copilot-configuration-end -->';
            const first = body.indexOf(start);
            const last = body.indexOf(end, first + start.length);
            if (first < 0 || last < 0 || body.indexOf(start, first + start.length) >= 0) throw new Error('A unique durable configuration is required.');
            const payload = JSON.parse(body.slice(first + start.length, last));
            const state = payload?.deploymentOrchestration;
            const receipt = state?.publicationReceipt;
            const phase = state?.phase === 'blocked' && state?.lastFailure?.retryable === true
              ? state.lastFailure.previousPhase : state?.phase;
            if (payload?.schemaVersion !== 3 || state?.stateVersion !== 1
              || !Number.isSafeInteger(state?.revision) || state.revision < 1
              || state.operationId !== process.env.OPERATION_ID || state.version !== process.env.VERSION
              || !['reconciliation_pending', 'completed'].includes(phase) || state.publicationVerified !== true
              || !/^[a-f0-9]{40}$/i.test(state.productionSha || '') || state.tag !== `v${process.env.VERSION}`
              || receipt?.operationId !== state.operationId || receipt?.productionSha !== state.productionSha
              || receipt?.tag !== state.tag) throw new Error('Recovery requires the matching, already verified publication and reconciliation state.');
      - name: Resume reconciliation from verified receipts
        uses: vypdev/copilot@v3
        with:
          single-action: published_deployment_action
          single-action-issue: ${{ inputs.issue }}
          issue-workflow-profile: ${{ vars.COPILOT_ISSUE_WORKFLOW_PROFILE || '' }}
          single-action-operation-id: ${{ inputs.operation-id }}
          single-action-version: ${{ inputs.version }}
          merge-queue-check-attestations: ${{ vars.MERGE_QUEUE_CHECK_ATTESTATIONS || '[]' }}
          token: ${{ secrets.PAT }}

  report-failure:
    name: Report orchestration failure
    runs-on:
      group: vypdev
      labels:
        - self-hosted
        - codex
        - Linux
    timeout-minutes: 5
    needs: [validate, update_files, ready_to_tag, promote, publish, resume-reconciliation]
    if: ${{ failure() && needs.validate.result == 'success' }}
    permissions:
      issues: write
    steps:
      - name: Persist publication failure
        if: ${{ inputs.mode == 'publish' || inputs.mode == 'resume' }}
        uses: vypdev/copilot@v3
        with:
          single-action: failed_deployment_action
          single-action-issue: ${{ inputs.issue }}
          issue-workflow-profile: ${{ vars.COPILOT_ISSUE_WORKFLOW_PROFILE || '' }}
          single-action-operation-id: ${{ inputs.operation-id }}
          single-action-version: ${{ inputs.version }}
          single-action-message: Publication failed. Review ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }} before retrying.
          token: ${{ secrets.PAT }}
      - name: Report preparation failure
        if: ${{ inputs.mode == 'prepare' }}
        uses: vypdev/copilot@v3
        with:
          single-action: publish_issue_comment
          single-action-issue: ${{ inputs.issue }}
          issue-workflow-profile: ${{ vars.COPILOT_ISSUE_WORKFLOW_PROFILE || '' }}
          single-action-message: |
            ## ❌ Release orchestration needs attention

            Phase `${{ inputs.mode }}` failed. Review the control center before retrying.

            [Review the workflow run](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})
          token: ${{ secrets.PAT }}
