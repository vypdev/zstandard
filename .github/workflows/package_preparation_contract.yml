name: Package preparation contract
on:
  pull_request:
    paths:
      - '.github/actions/**'
      - '.github/workflows/**'
      - '.github/scripts/check_action_versions.py'
      - '.github/scripts/update_versions.dart'
      - '.github/scripts/tests/test_package_preparation.py'
      - '.github/scripts/tests/test_package_publication.py'
      - '.github/scripts/tests/test_release_checkout.py'
      - '.github/scripts/tests/test_flutter_project_files.py'
      - '.github/scripts/tests/test_hotfix_ref.py'
      - 'scripts/check_pub_metadata.dart'
      - 'scripts/check_release_tag.sh'
      - '.github/scripts/tests/test_release_tag.py'
      - '.github/scripts/tests/test_release_candidate.py'
      - '.github/scripts/tests/test_release_builds.py'
      - 'scripts/release_candidate.py'
      - '.github/workflows/publish_workflow.yml'
      - '.github/workflows/package_preparation_contract.yml'
      - '.github/workflows/release_workflow.yml'
      - '.github/workflows/hotfix_workflow.yml'
permissions:
  contents: read
jobs:
  package-preparation:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on:
      group: vypdev
      labels: [self-hosted, codex, Linux]
    timeout-minutes: 10
    env:
      # Keep imported test modules out of subsequent clean-workspace checkouts.
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-flutter
        with:
          flutter-version: '3.47.2'
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Install isolated YAML parser
        run: |
          python -m venv "$RUNNER_TEMP/preparation-contract"
          "$RUNNER_TEMP/preparation-contract/bin/python" -m pip install PyYAML==6.0.3
      - name: Require version tags for workflow and composite Actions
        run: '"$RUNNER_TEMP/preparation-contract/bin/python" .github/scripts/check_action_versions.py'
      - name: Verify safe replacement of inherited shallow checkout metadata
        run: '"$RUNNER_TEMP/preparation-contract/bin/python" -m unittest discover -s .github/scripts/tests -p test_release_checkout.py -v'
      - name: Verify Apple fixture restoration after Flutter migrations
        run: '"$RUNNER_TEMP/preparation-contract/bin/python" -m unittest discover -s .github/scripts/tests -p test_flutter_project_files.py -v'
      - name: Verify real metadata preparation and failure behavior
        run: '"$RUNNER_TEMP/preparation-contract/bin/python" -m unittest discover -s .github/scripts/tests -p test_package_preparation.py -v'
      - name: Verify publication ordering, credential renewal and failure recovery without uploads
        run: '"$RUNNER_TEMP/preparation-contract/bin/python" -m unittest discover -s .github/scripts/tests -p test_package_publication.py -v'
      - name: Reject preparation outside the matching hotfix branch
        run: '"$RUNNER_TEMP/preparation-contract/bin/python" -m unittest discover -s .github/scripts/tests -p test_hotfix_ref.py -v'
      - name: Verify release and hotfix tag provenance without publication
        run: '"$RUNNER_TEMP/preparation-contract/bin/python" -m unittest discover -s .github/scripts/tests -p test_release_tag.py -v'
      - name: Verify exact candidate evidence and Copilot ownership
        run: '"$RUNNER_TEMP/preparation-contract/bin/python" -m unittest discover -s .github/scripts/tests -p test_release_candidate.py -v'
      - name: Verify native commit retries and actual CMake toolchain resolution
        run: '"$RUNNER_TEMP/preparation-contract/bin/python" -m unittest discover -s .github/scripts/tests -p test_release_builds.py -v'
