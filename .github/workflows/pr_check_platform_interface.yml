name: PR Check Platform Interface

on:
  pull_request:
    branches:
      - '**'
      - '!master'
  push:
    branches:
      - develop

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Keep CI aligned with the package constraints. The organisation-level
  # FLUTTER_VERSION variable may intentionally point to an older SDK.
  FLUTTER_VERSION: '3.47.2'

jobs:
  check_platform_interface_analyze:
    name: Analyze Platform Interface
    runs-on: [self-hosted, Linux]
    steps:
      - uses: actions/checkout@v6

      - uses: ./.github/actions/setup-flutter
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}

      - name: Get dependencies
        working-directory: zstandard_platform_interface
        run: flutter pub get

      - name: Analyze check
        working-directory: zstandard_platform_interface
        run: flutter analyze

  check_platform_interface_test:
    name: Test Platform Interface
    runs-on: [self-hosted, Linux]
    steps:
      - uses: actions/checkout@v6

      - uses: ./.github/actions/setup-linux-dependencies
        with:
          coverage: 'true'

      - uses: ./.github/actions/setup-flutter
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}

      - name: Get dependencies
        working-directory: zstandard_platform_interface
        run: flutter pub get

      - name: Test check
        working-directory: zstandard_platform_interface
        run: flutter test --coverage

      # Coverage threshold: lib/ only (same pattern as CLI)
      - name: Check coverage threshold (85% of lib/)
        working-directory: zstandard_platform_interface
        run: |
          lcov --extract coverage/lcov.info 'lib/*' -o coverage/lcov_lib.info
          COVERAGE=$(lcov --summary coverage/lcov_lib.info 2>&1 | grep "lines" | awk '{print $2}' | sed 's/%//')
          echo "Coverage (lib/ only): ${COVERAGE}%"
          if [ -z "$COVERAGE" ]; then echo "Could not parse coverage"; exit 1; fi
          if (( $(echo "$COVERAGE < 85" | bc -l) )); then echo "ERROR: Coverage ${COVERAGE}% is below 85%"; exit 1; fi

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: zstandard_platform_interface/coverage/lcov.info
          flags: platform_interface
          fail_ci_if_error: true

  check_platform_interface_publish_dry_run:
    name: Dry Run Publish Platform Interface
    runs-on: [self-hosted, Linux]
    steps:
      - uses: actions/checkout@v6

      - uses: ./.github/actions/preserve-flutter-project-files
        with:
          package: zstandard_platform_interface
          mode: save

      - uses: ./.github/actions/setup-flutter
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}

      - name: Get dependencies
        working-directory: zstandard_platform_interface
        run: flutter pub get

      - uses: ./.github/actions/preserve-flutter-project-files
        with:
          package: zstandard_platform_interface
          mode: restore

      - name: Publish Dry Run
        working-directory: zstandard_platform_interface
        run: dart pub publish --dry-run
