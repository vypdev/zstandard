name: PR Check Android

on:
  push:
    branches:
      - develop
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Keep CI aligned with the package constraints. The organisation-level
  # FLUTTER_VERSION variable may intentionally point to an older SDK.
  FLUTTER_VERSION: '3.47.2'
  # AOSP ATD images are designed for automated tests and avoid the background
  # Google services that starve this software-only self-hosted emulator.
  ANDROID_API_LEVEL: '30'
  ANDROID_SYSTEM_IMAGE_TARGET: 'aosp_atd'
  ANDROID_SYSTEM_IMAGE_ARCH: 'x86_64'

jobs:
  check_android_analyze:
    name: Analyze Android
    runs-on: [self-hosted, Linux]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803

      - uses: ./.github/actions/setup-flutter
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}

      - name: Resolve workspace dependencies
        run: dart scripts/create_local_overrides.dart zstandard_android

      - name: Get dependencies
        working-directory: zstandard_android
        run: flutter pub get

      - name: Analyze check
        working-directory: zstandard_android
        run: flutter analyze lib test

      - name: Get modern example dependencies
        working-directory: zstandard_android/example
        run: flutter pub get

      - name: Analyze modern example
        working-directory: zstandard_android/example
        run: flutter analyze

      - name: Get legacy example dependencies
        working-directory: zstandard_android/example_legacy
        run: flutter pub get

      - name: Analyze legacy example
        working-directory: zstandard_android/example_legacy
        run: flutter analyze

      - name: Run package tests
        working-directory: zstandard_android
        run: flutter test

  check_android_test:
    name: Test Android (${{ matrix.example }}, ${{ matrix.source }})
    runs-on: [self-hosted, Linux]
    timeout-minutes: 60
    strategy:
      fail-fast: false
      # The self-hosted runner shares one ADB daemon and one emulator port.
      max-parallel: 1
      matrix:
        example: [example, example_legacy]
        source: [workspace, package-config]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803

      - uses: ./.github/actions/setup-linux-dependencies
        with:
          android: 'true'

      - uses: ./.github/actions/setup-flutter
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}

      - name: Stage native package outside the repository
        if: matrix.source == 'package-config'
        run: |
          mkdir -p "$RUNNER_TEMP/zstandard-stage"
          mv zstandard_native "$RUNNER_TEMP/zstandard-stage/zstandard_native"

      - name: Resolve the selected native source exactly
        run: |
          if [[ "${{ matrix.source }}" == package-config ]]; then
            dart scripts/create_local_overrides.dart zstandard_android \
              "$RUNNER_TEMP/zstandard-stage/zstandard_native"
          else
            dart scripts/create_local_overrides.dart zstandard_android
          fi

      - name: Get dependencies
        working-directory: zstandard_android/${{ matrix.example }}
        run: flutter pub get

      - name: Clean and get plugin dependencies
        working-directory: zstandard_android
        run: |
          flutter clean
          # The plugin CMake cache is kept outside Flutter's build directory
          # on persistent self-hosted runners. Remove it so workspace and
          # package-config matrix entries cannot reuse a previous native source.
          rm -rf android/.cxx
          flutter pub get

      - name: Clean and get example dependencies
        working-directory: zstandard_android/${{ matrix.example }}
        run: |
          flutter clean
          flutter pub get

      - name: Set up JDK 17 (required by Android SDK tools and Gradle)
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Android SDK tools
        uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699

      - name: Verify Android SDK prerequisites
        run: bash scripts/check_android_ci_prerequisites.sh

      - name: Verify Android Gradle consumer configuration
        working-directory: zstandard_android/${{ matrix.example }}
        run: |
          set -euo pipefail
          if [[ "${{ matrix.example }}" == 'example' ]]; then
            grep -F 'id "com.android.application" version "9.1.0" apply false' android/settings.gradle
            grep -F 'gradle-9.3.1-all.zip' android/gradle/wrapper/gradle-wrapper.properties
          else
            grep -F 'id "com.android.application" version "8.11.1" apply false' android/settings.gradle
            grep -F 'gradle-8.14-all.zip' android/gradle/wrapper/gradle-wrapper.properties
          fi

      - name: Build Android debug APKs for all supported Flutter ABIs
        working-directory: zstandard_android/${{ matrix.example }}
        run: flutter build apk --debug --split-per-abi --target-platform android-arm,android-arm64,android-x64

      - name: Verify selected Gradle runtime
        working-directory: zstandard_android/${{ matrix.example }}/android
        run: bash ./gradlew --no-daemon --version

      - name: Verify debug APK native libraries
        working-directory: zstandard_android/${{ matrix.example }}
        run: bash ../../scripts/check_android_apk_abis.sh build/app/outputs/flutter-apk debug

      - name: Build Android release APKs for all supported Flutter ABIs
        if: matrix.source == 'workspace'
        working-directory: zstandard_android/${{ matrix.example }}
        run: flutter build apk --release --split-per-abi --target-platform android-arm,android-arm64,android-x64

      - name: Verify release APK native libraries
        if: matrix.source == 'workspace'
        working-directory: zstandard_android/${{ matrix.example }}
        run: bash ../../scripts/check_android_apk_abis.sh build/app/outputs/flutter-apk release

      - name: Run Flutter and native Android tests on emulator
        run: |
          # Boot the software emulator once per matrix entry. Rebooting it
          # between suites makes Flutter's test-app handshake flaky on the
          # shared Linux runner. Each individual command remains bounded.
          bash scripts/run_android_emulator_ci.sh \
            bash -c '
              set -euo pipefail
              cd zstandard_android/${{ matrix.example }}
              timeout --foreground 10m \
                flutter test integration_test/android_compression_integration_test.dart \
                -d emulator-${EMULATOR_PORT} --reporter expanded
              timeout --foreground 10m \
                flutter test integration_test/android_properties_integration_test.dart \
                -d emulator-${EMULATOR_PORT} --reporter expanded
              cd android
              timeout --foreground 15m \
                bash ./gradlew --no-daemon connectedDebugAndroidTest --stacktrace
            '

      - name: Upload Android emulator diagnostics
        if: always()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4
        with:
          name: android-emulator-logs-${{ matrix.example }}-${{ matrix.source }}-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/zstandard_ci_test-*.log
            ${{ runner.temp }}/zstandard_ci_test-*.txt
          if-no-files-found: ignore

      - name: Restore workspace native package
        if: always() && matrix.source == 'package-config'
        run: |
          if [[ -d "$RUNNER_TEMP/zstandard-stage/zstandard_native" ]]; then
            mv "$RUNNER_TEMP/zstandard-stage/zstandard_native" zstandard_native
          fi

  check_android_publish_dry_run:
    name: Dry Run Publish Android
    runs-on: [self-hosted, Linux]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803

      - uses: ./.github/actions/preserve-flutter-project-files
        with:
          package: zstandard_android
          mode: save

      - uses: ./.github/actions/setup-flutter
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}

      - name: Resolve workspace dependencies
        run: dart scripts/create_local_overrides.dart zstandard_android

      - name: Get dependencies
        working-directory: zstandard_android
        run: flutter pub get

      - uses: ./.github/actions/preserve-flutter-project-files
        with:
          package: zstandard_android
          mode: restore

      - name: Publish Dry Run
        working-directory: zstandard_android
        run: dart pub publish --dry-run
