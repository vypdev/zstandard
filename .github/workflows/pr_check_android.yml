name: PR Check Android

on:
  pull_request:
    branches:
      - '**'
      - '!master'
  push:
    branches:
      - develop

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Keep CI aligned with the package constraints. The organisation-level
  # FLUTTER_VERSION variable may intentionally point to an older SDK.
  FLUTTER_VERSION: '3.47.2'

jobs:
  check_android_analyze:
    name: Analyze Android
    runs-on: [self-hosted, Linux]
    steps:
      - uses: actions/checkout@v6

      - uses: ./.github/actions/setup-flutter
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}

      - name: Get dependencies
        working-directory: zstandard_android
        run: flutter pub get

      - name: Analyze check
        working-directory: zstandard_android
        run: flutter analyze

      - name: Run package tests
        working-directory: zstandard_android
        run: flutter test

  check_android_test:
    name: Test Android
    runs-on: [self-hosted, Linux]
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6

      - uses: ./.github/actions/setup-linux-dependencies

      - uses: ./.github/actions/setup-flutter
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}

      - name: Get dependencies
        working-directory: zstandard_android/example
        run: flutter pub get

      - name: Set up JDK 17 (required by Android SDK tools and Gradle)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Android SDK tools
        uses: android-actions/setup-android@v4

      - name: Verify Android SDK prerequisites
        run: bash scripts/check_android_ci_prerequisites.sh

      - name: Build Android example APK
        working-directory: zstandard_android/example
        run: flutter build apk --debug

      - name: Run integration tests on emulator
        run: |
          # Launch the emulator directly so a slow software boot cannot fail
          # on the action's unconditional input-keyevent helper.
          bash scripts/run_android_emulator_ci.sh \
            bash -c 'cd zstandard_android/example && flutter test integration_test/ -d emulator-${EMULATOR_PORT}'

  check_android_test_from_pub_cache:
    name: Test Android (from pub cache)
    # A self-hosted runner has one shared ADB daemon. Keep the two software
    # emulators from racing over it when both test jobs target the same host.
    needs: check_android_test
    if: ${{ always() }}
    runs-on: [self-hosted, Linux]
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6

      - uses: ./.github/actions/setup-linux-dependencies

      - uses: ./.github/actions/setup-flutter
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}

      - name: Remove zstandard_native to force resolution from pub cache
        run: rm -rf zstandard_native

      - name: Clean and get dependencies (force pub cache)
        working-directory: zstandard_android
        run: |
          flutter clean
          flutter pub get

      - name: Get dependencies in example (force pub cache)
        working-directory: zstandard_android/example
        run: |
          flutter clean
          flutter pub get

      - name: Set up JDK 17 (required by Android SDK tools and Gradle)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Android SDK tools
        uses: android-actions/setup-android@v4

      - name: Verify Android SDK prerequisites
        run: bash scripts/check_android_ci_prerequisites.sh

      - name: Build Android example APK from pub cache
        working-directory: zstandard_android/example
        run: flutter build apk --debug

      - name: Run integration tests on emulator (from pub cache)
        run: |
          bash scripts/run_android_emulator_ci.sh \
            bash -c 'cd zstandard_android/example && flutter test integration_test/ -d emulator-${EMULATOR_PORT}'

  check_android_publish_dry_run:
    name: Dry Run Publish Android
    runs-on: [self-hosted, Linux]
    steps:
      - uses: actions/checkout@v6

      - uses: ./.github/actions/preserve-flutter-project-files
        with:
          package: zstandard_android
          mode: save

      - uses: ./.github/actions/setup-flutter
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}

      - name: Get dependencies
        working-directory: zstandard_android
        run: flutter pub get

      - uses: ./.github/actions/preserve-flutter-project-files
        with:
          package: zstandard_android
          mode: restore

      - name: Publish Dry Run
        working-directory: zstandard_android
        run: dart pub publish --dry-run
