name: PR Check iOS

on:
  pull_request:
    branches:
      - '**'
  push:
    branches:
      - develop

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Swift Package Manager support requires Flutter 3.44 or newer.
  FLUTTER_VERSION: '3.47.2'

jobs:
  check_ios_analyze:
    name: Analyze iOS
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on:
      group: vypdev
      labels: [self-hosted, macOS, ARM64]
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6

      - uses: ./.github/actions/preserve-flutter-project-files
        with:
          package: zstandard_ios
          mode: save

      - uses: ./.github/actions/setup-flutter
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}

      - uses: ./.github/actions/prepare-candidate-dependencies
        with:
          source: workspace

      - name: Get dependencies
        working-directory: zstandard_ios
        run: flutter pub get

      - uses: ./.github/actions/preserve-flutter-project-files
        if: always()
        with:
          package: zstandard_ios
          mode: restore

      - name: Analyze check
        working-directory: zstandard_ios
        run: flutter analyze

      - name: Run package tests
        working-directory: zstandard_ios
        run: flutter test

  check_ios_test:
    name: Test iOS (${{ matrix.dependency_manager }}, ${{ matrix.source }})
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on:
      group: vypdev
      labels: [self-hosted, macOS, ARM64]
    timeout-minutes: 90
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        dependency_manager: [swiftpm, cocoapods]
        source: [workspace, pub-cache]
    steps:
      - uses: actions/checkout@v6

      - uses: ./.github/actions/preserve-flutter-project-files
        with:
          package: zstandard_ios
          mode: save

      - uses: ./.github/actions/setup-flutter
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}

      - name: Prepare private Flutter SDK with upstream iOS startup fix
        timeout-minutes: 10
        run: bash .github/scripts/prepare_ios_flutter.sh

      - uses: ./.github/actions/prepare-candidate-dependencies
        with:
          source: ${{ matrix.source }}

      - name: Select native dependency manager
        run: |
          if [[ "${{ matrix.dependency_manager }}" == "swiftpm" ]]; then
            flutter config --enable-swift-package-manager
          else
            flutter config --no-enable-swift-package-manager
          fi

      - name: Clean plugin and example
        run: |
          (cd zstandard_ios && flutter clean)
          (cd zstandard_ios/example && flutter clean)

      - name: Get plugin dependencies
        working-directory: zstandard_ios
        run: flutter pub get

      - name: Get example dependencies
        working-directory: zstandard_ios/example
        run: flutter pub get

      - uses: ./.github/actions/preserve-flutter-project-files
        if: always()
        with:
          package: zstandard_ios
          mode: restore

      - name: Install CocoaPods dependencies
        if: matrix.dependency_manager == 'cocoapods'
        working-directory: zstandard_ios/example/ios
        run: pod install --verbose

      - name: Build iOS example
        working-directory: zstandard_ios/example
        run: |
          set -o pipefail
          flutter build ios --simulator --debug --no-codesign --verbose 2>&1 | tee "$RUNNER_TEMP/ios-build.log"

      - name: Copy generated Flutter framework for SwiftPM integration tests
        if: matrix.dependency_manager == 'swiftpm' && matrix.source == 'pub-cache'
        run: |
          framework_package="$GITHUB_WORKSPACE/zstandard_ios/example/ios/Flutter/ephemeral/Packages/.packages/FlutterFramework"
          framework_copy="$GITHUB_WORKSPACE/zstandard_ios/ios/FlutterFramework"
          test -f "$framework_package/Package.swift"
          if [[ -e "$framework_copy" || -L "$framework_copy" ]]; then
            echo "Removing stale FlutterFramework path: $framework_copy"
            if [[ -L "$framework_copy" ]]; then
              rm "$framework_copy"
            else
              rm -R "$framework_copy"
            fi
          fi
          cp -R "$framework_package" "$framework_copy"

      - name: Boot an isolated iOS simulator
        id: ios-simulator
        # Includes three bounded setup commands and the ten-minute cold boot.
        timeout-minutes: 12
        run: python3 .github/scripts/start_ios_simulator.py

      - name: Run integration tests
        run: |
          DEVICE_ID="${{ steps.ios-simulator.outputs.device-id }}"
          cd zstandard_ios/example
          bash ../../scripts/run_with_timeout.sh 900 \
            flutter test integration_test/ios_integration_test.dart \
              -d "$DEVICE_ID" --reporter expanded --verbose

      - name: Capture iOS simulator diagnostics
        if: failure()
        timeout-minutes: 3
        run: |
          DEVICE_ID="${{ steps.ios-simulator.outputs.device-id }}"
          {
            echo '--- installed applications ---'
            xcrun simctl listapps "$DEVICE_ID" || true
            echo '--- recent Runner logs ---'
            xcrun simctl spawn "$DEVICE_ID" log show --last 10m --style compact \
              --predicate 'process == "Runner"' || true
            echo '--- simulator state ---'
            xcrun simctl list devices | grep "$DEVICE_ID" || true
          } > "$RUNNER_TEMP/ios-simulator-diagnostics.txt" 2>&1

      - name: Upload iOS simulator diagnostics
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: ios-simulator-diagnostics-${{ matrix.dependency_manager }}-${{ matrix.source }}-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/ios-simulator-diagnostics.txt
            ${{ runner.temp }}/ios-build.log
          if-no-files-found: ignore

      - name: Remove this job's iOS simulator
        if: ${{ always() && steps.ios-simulator.outputs.device-id != '' }}
        timeout-minutes: 3
        env:
          DEVICE_ID: ${{ steps.ios-simulator.outputs.device-id }}
        run: |
          xcrun simctl shutdown "$DEVICE_ID" 2>/dev/null || true
          xcrun simctl delete "$DEVICE_ID"

      - name: Remove temporary SwiftPM framework copy
        if: always() && matrix.dependency_manager == 'swiftpm' && matrix.source == 'pub-cache'
        run: |
          framework_copy="$GITHUB_WORKSPACE/zstandard_ios/ios/FlutterFramework"
          if [[ -L "$framework_copy" ]]; then
            rm "$framework_copy"
          elif [[ -d "$framework_copy" ]]; then
            rm -R "$framework_copy"
          elif [[ -e "$framework_copy" ]]; then
            rm "$framework_copy"
          fi

      - name: Restore this job's native workspace
        if: ${{ always() && env.ZSTANDARD_NATIVE_ORIGINAL_PATH != '' }}
        run: |
          set -euo pipefail
          test ! -e zstandard_native && test ! -L zstandard_native
          mv "$ZSTANDARD_NATIVE_ORIGINAL_PATH" zstandard_native

      - name: Remove this job's patched Flutter SDK
        if: ${{ always() && env.ZSTANDARD_IOS_FLUTTER_DIR != '' }}
        timeout-minutes: 3
        run: bash .github/scripts/prepare_ios_flutter.sh --cleanup

      - name: Restore Apple host files after Flutter migrations
        if: always()
        uses: ./.github/actions/preserve-flutter-project-files
        with:
          package: zstandard_ios
          mode: restore

  check_ios_publish_dry_run:
    name: Dry Run Publish iOS
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on:
      group: vypdev
      labels: [self-hosted, macOS, ARM64]
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6

      - uses: ./.github/actions/preserve-flutter-project-files
        with:
          package: zstandard_ios
          mode: save

      - uses: ./.github/actions/setup-flutter
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}

      - uses: ./.github/actions/prepare-candidate-dependencies
        with:
          source: workspace

      - name: Get dependencies
        working-directory: zstandard_ios
        run: flutter pub get

      - uses: ./.github/actions/preserve-flutter-project-files
        if: always()
        with:
          package: zstandard_ios
          mode: restore

      - name: Publish Dry Run
        working-directory: zstandard_ios
        run: dart pub publish --dry-run
