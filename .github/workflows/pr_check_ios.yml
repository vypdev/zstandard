name: PR Check iOS

on:
  push:
    branches:
      - develop
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Swift Package Manager support requires Flutter 3.44 or newer.
  FLUTTER_VERSION: '3.47.2'

jobs:
  check_ios_analyze:
    name: Analyze iOS
    runs-on: [self-hosted, macOS, ARM64]
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803

      - uses: ./.github/actions/preserve-flutter-project-files
        with:
          package: zstandard_ios
          mode: save

      - uses: ./.github/actions/setup-preinstalled-flutter
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}

      - name: Resolve workspace dependencies
        run: bash scripts/create_local_overrides.sh zstandard_ios

      - name: Get dependencies
        working-directory: zstandard_ios
        run: flutter pub get

      - uses: ./.github/actions/preserve-flutter-project-files
        with:
          package: zstandard_ios
          mode: restore

      - name: Analyze check
        working-directory: zstandard_ios
        run: flutter analyze

      - name: Run package tests
        working-directory: zstandard_ios
        run: flutter test

  check_ios_test:
    name: Test iOS (${{ matrix.dependency_manager }}, ${{ matrix.source }})
    runs-on: [self-hosted, macOS, ARM64]
    timeout-minutes: 90
    concurrency:
      group: zstandard-apple-flutter-toolchain
      cancel-in-progress: false
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        dependency_manager: [swiftpm, cocoapods]
        source: [workspace, package-config]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803

      - uses: ./.github/actions/preserve-flutter-project-files
        with:
          package: zstandard_ios
          mode: save

      - uses: ./.github/actions/setup-preinstalled-flutter
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}

      - name: Select native dependency manager
        run: |
          if [[ "${{ matrix.dependency_manager }}" == "swiftpm" ]]; then
            flutter config --enable-swift-package-manager
          else
            flutter config --no-enable-swift-package-manager
          fi

      - name: Use checkout for SwiftPM native dependency
        if: matrix.dependency_manager == 'swiftpm' && matrix.source == 'workspace'
        run: echo "ZSTANDARD_NATIVE_PACKAGE_PATH=$GITHUB_WORKSPACE" >> "$GITHUB_ENV"

      - name: Stage native SwiftPM and Dart packages outside the repository
        if: matrix.source == 'package-config'
        run: |
          mkdir -p "$RUNNER_TEMP/zstandard-stage"
          mv zstandard_native "$RUNNER_TEMP/zstandard-stage/zstandard_native"
          cp Package.swift "$RUNNER_TEMP/zstandard-stage/Package.swift"
          if [[ "${{ matrix.dependency_manager }}" == swiftpm ]]; then
            echo "ZSTANDARD_NATIVE_PACKAGE_PATH=$RUNNER_TEMP/zstandard-stage" >> "$GITHUB_ENV"
          fi

      - name: Resolve the selected native source exactly
        run: |
          if [[ "${{ matrix.source }}" == package-config ]]; then
            bash scripts/create_local_overrides.sh zstandard_ios \
              "$RUNNER_TEMP/zstandard-stage/zstandard_native"
          else
            bash scripts/create_local_overrides.sh zstandard_ios
          fi

      - name: Clean plugin and example
        run: |
          (cd zstandard_ios && flutter clean)
          (cd zstandard_ios/example && flutter clean)

      - name: Get plugin dependencies
        working-directory: zstandard_ios
        run: flutter pub get

      - name: Get example dependencies
        working-directory: zstandard_ios/example
        run: flutter pub get

      - uses: ./.github/actions/preserve-flutter-project-files
        with:
          package: zstandard_ios
          mode: restore

      - name: Install CocoaPods dependencies
        if: matrix.dependency_manager == 'cocoapods'
        working-directory: zstandard_ios/example/ios
        run: pod install --verbose

      - name: Build iOS example
        working-directory: zstandard_ios/example
        run: flutter build ios --simulator --debug --no-codesign

      - name: Boot iOS simulator headlessly
        run: |
          chmod +x scripts/manage_ios_simulator.sh
          ./scripts/manage_ios_simulator.sh start

      - name: Run integration tests
        run: |
          DEVICE_ID=$(./scripts/manage_ios_simulator.sh device-id)
          cd zstandard_ios/example
          bash ../../scripts/run_with_timeout.sh 900 \
            flutter test integration_test/ios_integration_test.dart \
              -d "$DEVICE_ID" --reporter expanded

      - name: Capture iOS simulator diagnostics
        if: failure()
        run: |
          DEVICE_ID=$(./scripts/manage_ios_simulator.sh device-id)
          {
            echo '--- installed applications ---'
            xcrun simctl listapps "$DEVICE_ID" || true
            echo '--- recent Runner logs ---'
            xcrun simctl spawn "$DEVICE_ID" log show --last 10m --style compact \
              --predicate 'process == "Runner"' || true
            echo '--- simulator state ---'
            xcrun simctl list devices | grep "$DEVICE_ID" || true
          } > "$RUNNER_TEMP/ios-simulator-diagnostics.txt" 2>&1

      - name: Upload iOS simulator diagnostics
        if: failure()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4
        with:
          name: ios-simulator-diagnostics-${{ matrix.dependency_manager }}-${{ matrix.source }}-${{ github.run_id }}
          path: ${{ runner.temp }}/ios-simulator-diagnostics.txt
          if-no-files-found: ignore

      - name: Stop iOS simulator
        if: always()
        run: ./scripts/manage_ios_simulator.sh stop

      - name: Restore workspace native package
        if: always() && matrix.source == 'package-config'
        run: |
          if [[ -d "$RUNNER_TEMP/zstandard-stage/zstandard_native" ]]; then
            mv "$RUNNER_TEMP/zstandard-stage/zstandard_native" zstandard_native
          fi

      - name: Restore Flutter dependency-manager default
        if: always()
        run: flutter config --no-enable-swift-package-manager

  check_ios_publish_dry_run:
    name: Dry Run Publish iOS
    runs-on: [self-hosted, macOS, ARM64]
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803

      - uses: ./.github/actions/preserve-flutter-project-files
        with:
          package: zstandard_ios
          mode: save

      - uses: ./.github/actions/setup-preinstalled-flutter
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}

      - name: Get dependencies
        working-directory: zstandard_ios
        run: flutter pub get

      - uses: ./.github/actions/preserve-flutter-project-files
        with:
          package: zstandard_ios
          mode: restore

      - name: Publish Dry Run
        working-directory: zstandard_ios
        run: dart pub publish --dry-run
